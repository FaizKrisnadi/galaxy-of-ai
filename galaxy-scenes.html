<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy of AI</title>
<meta name="description" content="A personal, beginner-friendly galaxy for exploring how AI connects to infrastructure, economics, society, governance, politics and the environment. Local prototype; every explanation is short and source-linked.">
<style>
  :root{
    --bg1:#0b1026; --bg2:#141b3d; --ink:#e8edff; --dim:#9aa7d0; --line:#5a6aa3;
    --focus:#a5b4fc; --card:#151d3f; --link:#8ab4ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:radial-gradient(1200px 700px at 60% -10%, #1b2452 0%, var(--bg1) 55%, #070a1a 100%);
    min-height:100vh;
  }
  header{max-width:1200px;margin:0 auto;padding:18px 20px 6px}
  header h1{margin:0;font-size:22px;letter-spacing:.01em}
  header p{margin:3px 0 0;color:var(--dim);font-size:14px}
  header p b{color:var(--ink);font-weight:600}

  .stagewrap{max-width:1200px;margin:0 auto;padding:0 20px;position:relative}
  #stage{position:relative;width:1200px;height:780px;transform-origin:top left}
  #stars{position:absolute;inset:0;pointer-events:none}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#cdd7ff;opacity:.7;animation:tw 4s infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}

  #lines{position:absolute;inset:0;pointer-events:none}
  #lines .orbit{fill:none;stroke:#2c3768;stroke-width:1;stroke-dasharray:1 7;opacity:.8}
  #lines .spoke{stroke:#3d4a85;stroke-width:1.5;opacity:.9}
  #lines .spoke.hot{stroke:#8ab4ff;stroke-width:2.5;opacity:1}

  .scene{position:absolute;inset:0;display:none}
  .scene.on{display:block;animation:fadein .35s ease}
  @keyframes fadein{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

  /* ---- overview nodes ---- */
  #sun{position:absolute;left:600px;top:390px;transform:translate(-50%,-50%);width:190px;height:190px;border-radius:50%;
       border:none;cursor:pointer;color:#fff;font:inherit;
       background:radial-gradient(circle at 38% 35%, #fff7d6 0%, #ffd76a 38%, #f59e0b 68%, #b45309 100%);
       box-shadow:0 0 46px 12px rgba(251,191,36,.45), 0 0 140px 40px rgba(251,191,36,.14);
       animation:pulse 5s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 46px 12px rgba(251,191,36,.45),0 0 140px 40px rgba(251,191,36,.14)}
                   50%{box-shadow:0 0 60px 18px rgba(251,191,36,.6),0 0 170px 50px rgba(251,191,36,.2)}}
  #sun .t{display:block;font-size:26px;font-weight:800;text-shadow:0 1px 8px rgba(120,60,0,.5)}
  #sun .s{display:block;font-size:11.5px;margin-top:2px;color:#7c2d12;font-weight:600}

  .planet{position:absolute;left:0;top:0;border:none;cursor:pointer;color:var(--ink);
          font:inherit;background:transparent;padding:6px;text-align:center;width:170px;will-change:transform}
  .planet .ball{width:86px;height:86px;margin:0 auto 6px;border-radius:50%;display:block;
                box-shadow:inset -14px -12px 26px rgba(0,0,0,.55), 0 0 22px rgba(148,163,255,.25);
                transition:transform .18s ease, box-shadow .18s ease}
  .planet .t{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
  .planet .s{display:block;font-size:11px;color:var(--dim);margin-top:1px}
  .planet:hover .ball,.planet:focus-visible .ball{transform:scale(1.1);box-shadow:inset -14px -12px 26px rgba(0,0,0,.55),0 0 34px rgba(165,180,252,.55)}

  /* ---- world scene ---- */
  .world-core{position:absolute;transform:translate(-50%,-50%);width:170px;height:170px;border-radius:50%;
              border:none;cursor:pointer;color:#0b1026;font:inherit;font-weight:800;font-size:17px;
              box-shadow:0 0 40px 6px rgba(148,163,255,.35)}
  .world-core .go{display:block;font-size:11px;font-weight:600;margin-top:2px;opacity:.75}
  .topic{position:absolute;transform:translate(-50%,-50%);width:190px;border-radius:14px;cursor:pointer;
         font:inherit;text-align:center;color:var(--ink);padding:10px 12px;
         background:rgba(21,29,63,.92);border:1.5px solid #3d4a85;transition:border-color .15s,box-shadow .15s}
  .topic:hover,.topic:focus-visible{border-color:var(--focus);box-shadow:0 0 20px rgba(138,180,255,.35)}
  .topic .t{display:block;font-size:13.5px;font-weight:700;line-height:1.3}
  .topic .s{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
  .topic.connected{border-color:var(--focus);box-shadow:0 0 18px rgba(138,180,255,.5)}
  .topic.soft{opacity:.4}

  .topiclink{fill:none;stroke-width:1.8;opacity:.8}
  .topiclink.solid{stroke:#7f8ec4}
  .topiclink.dotted{stroke:#8d99c9;stroke-dasharray:3 6}
  .topiclink.hot{stroke:#a5b4fc;stroke-width:3;opacity:1}
  .arc{fill:none;stroke:#66739f;stroke-width:1.2;opacity:.35}
  .arc.dotted{stroke-dasharray:2 6}

  .crumb{position:absolute;top:6px;left:8px;font-size:13.5px;color:var(--dim)}
  .crumb button{background:none;border:none;color:var(--link);font:inherit;font-size:13.5px;cursor:pointer;padding:6px 8px;border-radius:8px}
  .crumb button:hover,.crumb button:focus-visible{color:var(--focus);outline:none;background:rgba(165,180,252,.12)}

  /* ---- topic card ---- */
  #card{position:fixed;top:70px;right:max(16px,calc((100vw - 1240px)/2));width:400px;max-height:calc(100vh - 100px);
        overflow:auto;background:var(--card);border:1px solid #2e3a6e;border-radius:16px;padding:18px 20px;
        box-shadow:0 18px 60px rgba(0,0,0,.55);display:none;z-index:30}
  #card.on{display:block;animation:slidein .28s ease}
  @keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
  #card .crumb2{font-size:12.5px;color:var(--dim);margin-bottom:6px}
  #card .crumb2 button{background:none;border:none;color:var(--link);font:inherit;font-size:12.5px;cursor:pointer;padding:2px 0}
  #card h2{margin:0 0 2px;font-size:19px}
  #card .tag{color:var(--dim);font-size:13px;margin:0 0 8px}
  #card p{margin:8px 0;font-size:14px}
  #card .unk{color:#c7b98a;font-size:13px;font-style:italic;margin:10px 0 0}
  #card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:16px 0 4px}
  #card ul{margin:4px 0;padding-left:18px}
  #card li{margin:5px 0;font-size:13.5px}
  #card a{color:var(--link)}
  #card .xlink{background:none;border:none;color:var(--link);font:inherit;font-size:13.5px;cursor:pointer;padding:0;text-align:left;display:block;margin:6px 0}
  #card .xlink:hover,#card .xlink:focus-visible{color:var(--focus)}
  #card .xlink.dotted i{border-bottom:1px dotted var(--link)}
  #card .xlink i{font-style:normal}
  #card .xlink .where{color:var(--dim);font-size:12px}
  #card .close{position:sticky;top:0;float:right;background:rgba(21,29,63,.9);border:1px solid #3d4a85;color:var(--ink);
               border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer;line-height:1}
  #card .close:hover,#card .close:focus-visible{border-color:var(--focus);color:var(--focus)}

  .legend{max-width:1200px;margin:10px auto 0;padding:0 20px;color:var(--dim);font-size:12.5px}
  .legend span{white-space:nowrap}
  .sw{display:inline-block;width:22px;height:0;border-top:2px solid #8ab4ff;vertical-align:middle;margin:0 4px 2px 0}
  .sw.d{border-top-style:dotted;border-top-color:#9aa7d0}

  button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  h2:focus,h1:focus{outline:none}

  /* ---- small screens: stacked, touch-friendly ---- */
  @media (max-width:760px){
    body.listmode #stage{width:100%;height:auto;transform:none!important}
    body.listmode #lines{display:none}
    body.listmode .scene{position:static;display:none;padding:4px 2px 12px}
    body.listmode .scene.on{display:block}
    body.listmode #sun,.listmode #sun{position:static;display:block;margin:14px auto 4px;transform:none;width:150px;height:150px}
    body.listmode .planet{position:static;display:flex;align-items:center;gap:14px;width:100%;transform:none;text-align:left;padding:12px 10px}
    body.listmode .planet .ball{width:58px;height:58px;margin:0;flex:0 0 58px}
    body.listmode .planet .t{font-size:16px}
    body.listmode .world-core{position:static;display:block;margin:16px auto;transform:none}
    body.listmode .topic{position:static;display:block;width:100%;transform:none;margin:10px 0;text-align:left}
    body.listmode .crumb{position:static;margin:8px 0}
    #card{top:auto;bottom:0;right:0;left:0;width:100%;max-height:72vh;border-radius:18px 18px 0 0;border-bottom:none}
  }
  @media (prefers-reduced-motion:reduce){
    .star,#sun{animation:none}
    .scene.on,#card.on,.planet .ball{animation:none;transition:none}
  }
</style>
</head>
<body>
<header>
  <h1>Galaxy of AI</h1>
  <p>A personal map for understanding AI. <b>Click a planet</b> to see its topics; click a topic to read a short, source-linked explanation. <b>Esc</b> takes you back.</p>
</header>

<div class="stagewrap">
  <div id="stage">
    <div id="stars" aria-hidden="true"></div>
    <svg id="lines" width="1200" height="780" viewBox="0 0 1200 780" aria-hidden="true"></svg>
    <section class="scene on" id="scene-overview" aria-label="Galaxy overview">
      <button id="sun"><span class="t">AI</span><span class="s">the sun of this galaxy</span></button>
      <!-- planets injected -->
    </section>
    <section class="scene" id="scene-world" aria-label="World view">
      <nav class="crumb"><button id="back-galaxy">&#8592; Galaxy</button></nav>
      <!-- world core + topics injected -->
    </section>
  </div>
</div>

<p class="legend"><span class="sw"></span>connection described by a linked source&nbsp;&nbsp;&nbsp;<span class="sw d"></span>a link worth exploring — not evidence</p>

<aside id="card" aria-live="polite">
  <button class="close" id="card-close" aria-label="Close (Esc)">&#10005;</button>
  <div class="crumb2" id="card-crumb"></div>
  <h2 id="card-title" tabindex="-1"></h2>
  <p class="tag" id="card-tag"></p>
  <div id="card-body"></div>
</aside>

<script>
"use strict";

/* =============================================================
   GALAXY DATA
   To extend: add a world to GALAXY.worlds, or a topic to a world.
   Cross-links: {to:"worldId/topicId", label, dotted:true?}
   dotted = a connection worth exploring, not backed by a source.
   ============================================================= */

const GALAXY = {
  sun: {
    title:"AI", tagline:"the sun of this galaxy",
    body:[
      "<p>Artificial intelligence means computer systems that do things we used to need people for: writing, answering questions, spotting patterns, writing code. Modern AI is mostly large models \u2014 programs trained on huge amounts of data, then run every time someone uses them.</p>",
      "<p>Everything in this galaxy connects to AI in one of four ways: building it, running it, paying for it, or governing it. Click a planet to explore one of these worlds.</p>",
      "<p>One habit worth keeping anywhere on this map: a connection means <i>these things are related</i> \u2014 it never means <i>this causes that</i>.</p>"
    ],
    sources:[
      {label:"Further reading \u2014 IBM: What is artificial intelligence (AI)?", url:"https://www.ibm.com/think/topics/artificial-intelligence"}
    ]
  },

  worlds: [
    {
      id:"how", title:"How AI works", tagline:"what AI actually is", color:"#a78bfa", orbit:{i:0, a:215},
      topics:[
        { id:"models", title:"Models & training", tagline:"learned, not programmed",
          body:[
            "<p>A model is a program that learned patterns from millions of examples. Training means adjusting it over and over until its answers get good \u2014 nobody writes its rules by hand.</p>",
            "<p>What comes out depends on the data and the training choices, which is why two models built the same way can behave differently.</p>"
          ],
          unknown:"Exactly what a model learns \u2014 and what it merely memorises \u2014 is still an open research question.",
          sources:[{label:"Further reading \u2014 IBM: What is artificial intelligence? (learning from data)", url:"https://www.ibm.com/think/topics/artificial-intelligence"}],
          links:[{to:"how/data", label:"only as good as its data"}] },
        { id:"data", title:"Data", tagline:"what models learn from",
          body:[
            "<p>Models learn from enormous collections of text, images and code. What was collected, whether it was allowed, and whose voices it includes are active debates.</p>"
          ],
          unknown:"What counts as fair and representative training data is unsettled.",
          sources:[{label:"Further reading \u2014 IBM: What is artificial intelligence? (training data)", url:"https://www.ibm.com/think/topics/artificial-intelligence"}],
          links:[{to:"how/inference", label:"flows into every use"},
                 {to:"society/participation", label:"whose voices are in the data?", dotted:true}] },
        { id:"inference", title:"Inference & everyday use", tagline:"the moment you touch AI",
          body:[
            "<p>Every time someone types a prompt, the model runs somewhere and produces an answer \u2014 the jargon is \u201cinference\u201d. That is the moment AI touches electricity, data centres and money.</p>"
          ],
          sources:[{label:"Further reading \u2014 IEA tracker: data-centre electricity consumption", url:"https://www.iea.org/energy-system/buildings/data-centres-and-data-transmission-networks"}],
          links:[
            {to:"infrastructure/centres", label:"runs in a data centre somewhere"},
            {to:"economics/investment", label:"each use costs a little money and power"},
            {to:"how/agents", label:"some uses act on their own"},
            {to:"how/evaluation", label:"check before trusting"}
          ] },
        { id:"evaluation", title:"Evaluation & benchmarks", tagline:"testing what models can do",
          body:[
            "<p>Researchers test models with standard question sets (\u201cbenchmarks\u201d) and safety evaluations. Independent evaluations also exist \u2014 one 2026 preprint ran 34 tests on a released model and found improvements alongside remaining weaknesses.</p>",
            "<p>A good benchmark score is evidence about the test \u2014 not proof of how a system behaves in the world.</p>"
          ],
          unknown:"Benchmarks age quickly, and scores say little about real-world rates of harm.",
          sources:[{label:"Further reading \u2014 Huang et al.: an example of independent evaluation (arXiv preprint)", url:"https://arxiv.org/abs/2610.35671"}] },
        { id:"agents", title:"Agents & doing tasks", tagline:"AI that acts, not just answers",
          body:[
            "<p>AI agents are systems that do not just answer \u2014 they carry out sequences of actions: browsing, writing and running code, using tools. Because they act, they need monitoring: logs, alerts and sandboxes \u2014 machinery that can fail.</p>",
            "<p>In 2026, an external red team examined OpenAI\u2019s internal agent monitoring as it existed between 21 July and 11 August, and found ways it could be bypassed. OpenAI separately reported two of its coding agents disabling security alerts during routine tasks.</p>"
          ],
          unknown:"How often agents evade oversight in normal operation is unknown \u2014 the public evidence covers specific examined systems at specific dates.",
          sources:[
            {label:"METR & Redwood Research \u2014 Red-teaming OpenAI\u2019s agent monitoring (22 Oct 2026)", url:"https://metr.org/blog/2026-10-22-red-teaming-openai-agent-monitoring/"},
            {label:"OpenAI \u2014 incident report: suppressing monitoring alerts (20 Oct 2026)", url:"https://alignment.openai.com/misalignment-reports/suppressing-misalignment-monitoring-alerts-and-disabling-misalignment-monitoring/"}
          ],
          links:[{to:"governance/oversight", label:"oversight machinery for agents"}] },
        { id:"using", title:"Using AI in organisations", tagline:"adapting AI to real work",
          body:[
            "<p>Organisations usually adapt AI to their work \u2014 with prompts, templates and human review \u2014 rather than building models from scratch. One peer-reviewed study compared human experts, topic modelling and LLM-assisted analysis on 63 UN policy documents: AI made analysis faster, and the authors kept human interpretation central.</p>",
            "<p>An OECD review of guidelines across 14 countries found public-service AI rules fragmented, with weak measurement of performance, impact and compliance.</p>"
          ],
          unknown:"Whether AI-assisted analysis improves real decisions \u2014 rather than producing plausible drafts \u2014 is largely unmeasured.",
          sources:[
            {label:"Turobov & Coyle \u2014 Governing the evidence base (Data & Policy, CC BY)", url:"https://doi.org/10.1017/dap.2026.10100"},
            {label:"OECD Working Paper No. 93 \u2014 Generative AI experimentation in government", url:"https://doi.org/10.1787/42815683-en"}
          ],
          links:[
            {to:"governance/procurement", label:"public services buy and adapt AI"},
            {to:"society/skills", label:"verification work falls on people"}
          ] }
      ]
    },

    {
      id:"infrastructure", title:"Physical infrastructure", tagline:"the machines under AI", color:"#22d3ee", orbit:{i:1, a:170},
      topics:[
        { id:"centres", title:"Data centres", tagline:"where the computing happens",
          body:[
            "<p>Buildings full of computers. Many house the cloud services and websites everyone uses; a growing subset are built specifically for training and running AI. Two independent trackers watch the buildout: ArusGrid lists projects across Southeast Asia, the Gulf and India, with every claim backed by a dated source; Epoch AI tracks AI-optimised centres worldwide, partly by studying satellite photos of cooling equipment.</p>",
            "<p>A centre\u2019s size is measured by its IT load \u2014 the power its computers are rated to draw, in megawatts (MW). That is a measure of demand, not of electricity consumed over time. AI racks are much denser than traditional ones: 60 kW or more against 5\u201310 kW (ISIS Malaysia).</p>"
          ],
          unknown:"Both trackers are honest about gaps: Epoch estimates it covers about 46% (30\u201378%) of global AI compute, and ArusGrid says live megawatt figures are systematically undercounted.",
          sources:[
            {label:"ArusGrid \u2014 methodology", url:"https://arusgrid.com/methodology"},
            {label:"Epoch AI \u2014 Data Centers database, methodology", url:"https://epoch.ai/data/data-centers-documentation/methodology"},
            {label:"ISIS Malaysia \u2014 AI and Climate Considerations (Jun 2026)", url:"https://www.cert.isis.org.my/publications/ai-and-climate-considerations/"}
          ],
          links:[
            {to:"infrastructure/electricity", label:"the power demand"},
            {to:"infrastructure/water", label:"water where cooling needs it"},
            {to:"infrastructure/grids", label:"part of critical infrastructure"},
            {to:"economics/investment", label:"big capital projects"},
            {to:"environment/resources", label:"use land, power and water"},
            {to:"politics/chips", label:"chip export rules shape who can build"}
          ] },
        { id:"electricity", title:"Electricity", tagline:"the grid connection",
          body:[
            "<p>Data centres are large electricity customers running around the clock. An ISEAS commentary projects Malaysian data centres needing over 5,000 MW by 2035 \u2014 about 40% of Peninsular Malaysia\u2019s present power capacity \u2014 and notes operators have already secured 5.9 GW of maximum demand, which the author calls \u201chazardously high\u201d.</p>",
            "<p>The International Energy Agency keeps a dedicated tracker of data-centre electricity consumption (2015\u20132025).</p>"
          ],
          unknown:"How much electricity AI uses worldwide is not settled \u2014 estimates differ in what they count and which years.",
          sources:[
            {label:"ISEAS Perspective 2025/43 \u2014 Sara Loo (Jun 2025)", url:"https://www.iseas.edu.sg/articles-commentaries/iseas-perspective/2025-43-data-centres-energy-demand-and-sustainability-can-malaysia-strike-the-right-balance-by-sara-loo"},
            {label:"IEA \u2014 Data Centres: electricity consumption", url:"https://www.iea.org/energy-system/buildings/data-centres-and-data-transmission-networks"}
          ],
          links:[{to:"infrastructure/grids", label:"sits inside essential systems"},
                 {to:"environment/energy", label:"where the power comes from matters"}] },
        { id:"water", title:"Water & cooling", tagline:"not all centres are thirsty",
          body:[
            "<p>Not every data centre drinks water: some cool with air, others with water or hybrid designs \u2014 it depends on the cooling system, the climate and how the site is run.</p>",
            "<p>Where water <i>is</i> used, demand can be large. In Johor and two neighbouring Malaysian states, water utilities received requests of about 808 million litres a day and say around 142 million can realistically be supplied (ISIS Malaysia, citing SPAN). In Batam, Indonesia, Katadata reports the flagship data-centre project could use around 3 million litres a day on an island that relies entirely on six rain-fed reservoirs.</p>"
          ],
          unknown:"Whether data centres caused the water stress reported in Batam is not established \u2014 the report itself does not claim it, and one 2024 shortage there was blamed on a pipe leak.",
          sources:[
            {label:"ISIS Malaysia \u2014 AI and Climate Considerations (Jun 2026)", url:"https://www.cert.isis.org.my/publications/ai-and-climate-considerations/"},
            {label:"Katadata \u2014 A Digital Boom in a Thirsty City (Batam)", url:"https://katadata.co.id/data-center-batam/en"}
          ],
          links:[{to:"environment/resources", label:"the same water serves everyone"}] },
        { id:"chips", title:"Chips & supply chains", tagline:"the specialised hardware",
          body:[
            "<p>AI runs on specialised chips made by a handful of companies in concentrated supply chains. Governments treat them strategically: export rules decide who can buy the most advanced ones, and ArusGrid records a chip export-control access tier for every project it tracks.</p>",
            "<p>Trade research finds export controls concentrate on high-technology, economically important products \u2014 organised more around products than destination countries.</p>"
          ],
          unknown:"Who actually ends up with which chips is often secret; ownership and tenant arrangements are hard to observe.",
          sources:[
            {label:"ArusGrid \u2014 chip export-control access tiers", url:"https://arusgrid.com/methodology"},
            {label:"Patro & Santacreu \u2014 Geopolitical Distance and Targeted Trade (St Louis Fed Review)", url:"https://www.stlouisfed.org/publications/review/2026/sep/geopolitical-distance-and-targeted-trade"}
          ],
          links:[{to:"politics/chips", label:"the politics of chip controls"}] },
        { id:"land", title:"Land & permits", tagline:"where projects are allowed",
          body:[
            "<p>A data centre starts with land, a grid connection and planning approvals \u2014 decided through local processes, with residents and businesses living with the results.</p>",
            "<p>How fast that happens varies: Malaysia\u2019s \u201cGreen Lane\u201d pathway cut grid-connection times from 36\u201348 months to about 12 (ISEAS), and fast connection is one reason Johor concentrated so much capacity.</p>"
          ],
          unknown:"How approvals balance data centres against other local needs is a case-by-case question.",
          sources:[
            {label:"ISEAS Perspective 2025/43 \u2014 Sara Loo (Jun 2025)", url:"https://www.iseas.edu.sg/articles-commentaries/iseas-perspective/2025-43-data-centres-energy-demand-and-sustainability-can-malaysia-strike-the-right-balance-by-sara-loo"},
            {label:"Katadata \u2014 Batam reporting, incl. local context", url:"https://katadata.co.id/data-center-batam/en"}
          ],
          links:[{to:"infrastructure/centres", label:"approvals shape the buildout"}] },
        { id:"grids", title:"Grids & critical infrastructure", tagline:"hooking into essential systems",
          body:[
            "<p>Data centres and AI services plug into electricity, water and telecom networks that everyone depends on \u2014 \u201ccritical infrastructure\u201d. A peer-reviewed analysis of EU policy finds its governance adapting to AI and resilience goals in a path-dependent, uneven way: existing institutions stretch and adjust rather than being replaced.</p>"
          ],
          unknown:"That study analyses EU policy documents and standardisation \u2014 not measured outcomes at specific grid or water operators.",
          sources:[{label:"Pursiainen, R\u00f8d & Johansson \u2014 EU Governance of Critical Infrastructure (Eur. J. Security Research)", url:"https://doi.org/10.1007/s41125-026-00115-w"}],
          links:[{to:"governance/rules", label:"who governs essential systems"}] }
      ]
    },

    {
      id:"economics", title:"Economics", tagline:"who pays, who gains", color:"#fbbf24", orbit:{i:1, a:-25},
      topics:[
        { id:"investment", title:"Investment", tagline:"the money behind the buildout",
          body:[
            "<p>Data centres are big capital projects. ArusGrid records capital and power costs per project where figures are public; Epoch AI estimates roughly $38 billion of capital cost per gigawatt of IT power. Malaysia approved RM144.4 billion of data-centre projects between 2021 and mid-2025 (ISIS Malaysia).</p>"
          ],
          unknown:"About half of the facilities in ArusGrid have no usable capital figure \u2014 a missing number is not evidence of zero.",
          sources:[

const stage = document.getElementById("stage");
const linesSvg = document.getElementById("lines");
const overview = document.getElementById("scene-overview");

const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs){
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

/* stars — deterministic so they don't reshuffle on resize */
(function stars(){
  let s = 42; const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const box = document.getElementById("stars");
  for (let i = 0; i < 110; i++){
    const d = document.createElement("i");
    d.className = "star";
    d.style.left = (rnd() * 100) + "%";
    d.style.top = (rnd() * 100) + "%";
    d.style.animationDelay = (rnd() * 4).toFixed(2) + "s";
    d.style.opacity = (0.25 + rnd() * 0.6).toFixed(2);
    box.appendChild(d);
  }
})();

/* ---- overview ---- */
const CX = 600, CY = 390;
const RINGS = [{rx:235, ry:150}, {rx:370, ry:235}, {rx:495, ry:325}];
RINGS.forEach(({rx, ry}) => {
  linesSvg.appendChild(svgEl("ellipse", {class:"orbit", cx:CX, cy:CY, rx, ry}));
});

GALAXY.worlds.forEach(w => {
  const b = document.createElement("button");
  b.className = "planet";
  b.dataset.world = w.id;
  b.innerHTML = "<span class='ball' style='background:radial-gradient(circle at 35% 32%, " + w.color + " 0%, " +
    w.color + "cc 45%, #0b1026 130%)'></span><span class='t'>" + w.title + "</span><span class='s'>" + w.tagline + "</span>";
  b.addEventListener("click", () => openWorld(w.id));
  overview.appendChild(b);
});

/* ---- faint arcs between worlds whose topics are connected ---- */
const arcsG = svgEl("g", {id:"arcs"});
linesSvg.appendChild(arcsG);
const ARC_PAIRS = [];
(function buildArcPairs(){
  const seen = {};
  GALAXY.worlds.forEach(w => w.topics.forEach(t => (t.links || []).forEach(l => {
    const tw = l.to.split("/")[0];
    if (tw === w.id || !GALAXY.worlds.some(x => x.id === tw)) return;
    const key = [w.id, tw].sort().join("|");
    if (!seen[key]){
      seen[key] = {a:w.id, b:tw, dotted:false, n:0};
      ARC_PAIRS.push(seen[key]);
    }
    seen[key].n++;
    if (l.dotted) seen[key].dotted = true;
  })));
  const NAME = {}; GALAXY.worlds.forEach(w => NAME[w.id] = w.title);
  ARC_PAIRS.forEach(pr => {
    const path = svgEl("path", {class:"arc" + (pr.dotted ? " dotted" : "")});
    const tip = svgEl("title");
    tip.textContent = NAME[pr.a] + " \u2194 " + NAME[pr.b] + " \u2014 " + pr.n + " topic connection" + (pr.n > 1 ? "s" : "");
    path.appendChild(tip);
    pr.el = path;
    arcsG.appendChild(path);
  });
})();

function updateArcs(){
  const show = overview.classList.contains("on") && !document.body.classList.contains("listmode");
  arcsG.style.display = show ? "" : "none";
  if (!show) return;
  ARC_PAIRS.forEach(pr => {
    const A = planetPos(GALAXY.worlds.find(x => x.id === pr.a), orbitAngle);
    const B = planetPos(GALAXY.worlds.find(x => x.id === pr.b), orbitAngle);
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const dx = mx - CX, dy = my - CY;
    const dl = Math.hypot(dx, dy) || 1;
    const cx = mx + dx / dl * 42, cy = my + dy / dl * 42;
    pr.el.setAttribute("d", "M" + A.x + "," + A.y + " Q" + cx + "," + cy + " " + B.x + "," + B.y);
  });
}

function buildWorldScene(id){
  const w = GALAXY.worlds.find(x => x.id === id);
  worldScene.innerHTML = "";
  linesSvg.querySelectorAll(".spoke").forEach(e => e.remove()); // clear any previous world's spokes
  worldScene.prepend(makeCrumbNav());

  const core = document.createElement("button");
  core.className = "world-core";
  core.style.left = CX + "px";
  core.style.top = CY + "px";
  core.style.background = "radial-gradient(circle at 36% 32%, #ffffff33 0%, " + w.color + " 40%, " + w.color + " 70%, #0b1026 140%)";
  core.innerHTML = w.title + "<span class='go'>you are here</span>";
  core.setAttribute("aria-label", w.title + " \u2014 you are here");

  const n = w.topics.length;
  w.topics.forEach((t, i) => {
    const ang = -Math.PI/2 + i * 2 * Math.PI / n;
    const rx = 380, ry = 285;
    t._x = CX + rx * Math.cos(ang);
    t._y = CY + ry * Math.sin(ang) * (n <= 3 ? 0.8 : 1);
    const el = document.createElement("button");
    el.className = "topic";
    el.style.left = t._x + "px";
    el.style.top = t._y + "px";
    el.dataset.topic = w.id + "/" + t.id;
    el.innerHTML = "<span class='t'>" + t.title + "</span><span class='s'>" + t.tagline + "</span>";
    el.addEventListener("click", () => openCard(w.id + "/" + t.id));
    worldScene.appendChild(el);
    linesSvg.appendChild(svgEl("line", {class:"spoke hot", x1:CX, y1:CY, x2:t._x, y2:t._y}));
  });

  // visible connections between topics of this world
  w.topics.forEach(t => (t.links || []).forEach(l => {
    if (!l.to.startsWith(w.id + "/")) return;
    const other = w.topics.find(x => w.id + "/" + x.id === l.to);
    if (!other) return;
    const mx = (t._x + other._x) / 2, my = (t._y + other._y) / 2;
    const dx = other._x - t._x, dy = other._y - t._y;
    const len = Math.hypot(dx, dy) || 1;
    const cx = mx + (-dy / len) * 30, cy = my + (dx / len) * 30;
    const p = svgEl("path", {class:"topiclink " + (l.dotted ? "dotted" : "solid"),
      d:"M" + t._x + "," + t._y + " Q" + cx + "," + cy + " " + other._x + "," + other._y});
    p.dataset.a = w.id + "/" + t.id;
    p.dataset.b = l.to;
    linesSvg.appendChild(p);
  }));
  worldScene.appendChild(core); // core sits on top of the lines

  overview.classList.remove("on");
  worldScene.classList.add("on");
  worldScene.dataset.opened = id;
  relayout();
  hideCard();
}

function openWorld(id){
  buildWorldScene(id);
  const core = worldScene.querySelector(".world-core");
  if (core) core.focus();
}

function closeWorld(){
  worldScene.classList.remove("on");
  overview.classList.add("on");
  linesSvg.querySelectorAll(".spoke").forEach(e => e.remove());
  relayout();
  const id = worldScene.dataset.opened;
  const btn = id ? overview.querySelector("[data-world='" + id + "']") : null;
  if (btn) btn.focus();
}

/* ---- topic card ---- */
let lastTrigger = null;

function fillCard(ref){
  const hit = byTopic[ref];
  if (!hit) return false;
  const {world, topic} = hit;

  const crumb = document.getElementById("card-crumb");
  crumb.innerHTML = "";
  const cb = document.createElement("button");
  cb.textContent = world.title;
  cb.addEventListener("click", () => hideCard(true));
  crumb.append(cb, " \u203A " + topic.title);

  const title = document.getElementById("card-title");
  title.textContent = topic.title;
  document.getElementById("card-tag").textContent = world.title + " \u00b7 " + topic.tagline;

  let html = topic.body.join("");
  if (topic.unknown) html += "<p class='unk'>Still unknown: " + topic.unknown + "</p>";
  html += "<h3>Sources</h3><ul>" +
    topic.sources.map(s => "<li><a href='" + s.url + "' target='_blank' rel='noopener'>" + s.label + "</a></li>").join("") + "</ul>";
  if (topic.links && topic.links.length){
    html += "<h3>Reaches into</h3>" + topic.links.map(l => {
      const tgt = byTopic[l.to];
      if (!tgt) return "";
      return "<button class='xlink" + (l.dotted ? " dotted" : "") + "' data-goto='" + l.to + "'>" +
             "<i>" + l.label + "</i> <span class='where'>\u2192 " + tgt.world.title + " \u00b7 " + tgt.topic.title +
             (l.dotted ? " (worth exploring)" : "") + "</span></button>";
    }).join("");
  }
  document.getElementById("card-body").innerHTML = html;
  document.getElementById("card-body").querySelectorAll("[data-goto]").forEach(btn => {
    btn.addEventListener("click", () => {
      const to = btn.dataset.goto;
      const hit2 = byTopic[to];
      if (!hit2) return;
      if (worldScene.dataset.opened !== hit2.world.id){
        buildWorldScene(hit2.world.id);   // move to the other world behind the card
      }
      lastTrigger = worldScene.querySelector("[data-topic='" + to + "']");
      fillCard(to);
      card.classList.add("on");
      document.getElementById("card-title").focus();
    });
  });
  return true;
}

function highlightConnections(ref){
  const here = byTopic[ref].world.id;
  const conn = new Set(((byTopic[ref].topic.links) || [])
    .map(l => l.to).filter(k => byTopic[k] && byTopic[k].world.id === here));
  worldScene.querySelectorAll(".topic").forEach(el => {
    const key = el.dataset.topic;
    if (key === ref) return;
    const back = ((byTopic[key].topic.links) || []).some(l => l.to === ref);
    const lit = conn.has(key) || back;
    el.classList.toggle("connected", lit);
    el.classList.toggle("soft", !lit);
  });
  linesSvg.querySelectorAll(".topiclink").forEach(l => {
    l.classList.toggle("hot", l.dataset.a === ref || l.dataset.b === ref);
  });
}

function clearHighlights(){
  worldScene.querySelectorAll(".topic.connected,.topic.soft").forEach(el => el.classList.remove("connected", "soft"));
  linesSvg.querySelectorAll(".topiclink.hot").forEach(l => l.classList.remove("hot"));
}

function openCard(ref){
  if (!fillCard(ref)) return;
  lastTrigger = worldScene.querySelector("[data-topic='" + ref + "']") || document.getElementById("sun");
  card.classList.add("on");
  highlightConnections(ref);
  document.getElementById("card-title").focus();
}

function hideCard(refocus){
  card.classList.remove("on");
  clearHighlights();
  if (refocus && lastTrigger) lastTrigger.focus();
}

document.getElementById("card-close").addEventListener("click", () => hideCard(true));

/* sun card */
document.getElementById("sun").addEventListener("click", () => {
  const crumb = document.getElementById("card-crumb");
  crumb.textContent = "About this galaxy";
  const title = document.getElementById("card-title");
  title.textContent = GALAXY.sun.title;
  document.getElementById("card-tag").textContent = GALAXY.sun.tagline;
  document.getElementById("card-body").innerHTML =
    GALAXY.sun.body.join("") +
    "<h3>Sources</h3><ul>" +
    GALAXY.sun.sources.map(s => "<li><a href='" + s.url + "' target='_blank' rel='noopener'>" + s.label + "</a></li>").join("") + "</ul>";
  lastTrigger = document.getElementById("sun");
  card.classList.add("on");
  title.focus();
});

/* Esc: card first, then world */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (card.classList.contains("on")) hideCard(true);
  else if (worldScene.classList.contains("on")) closeWorld();
});

/* ---- planet positions & slow orbital motion ---- */
const ORBIT_PERIOD_MS = 160000; // one lap in ~2.7 minutes: slow, visible drift
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
let orbitAngle = 0, lastFrame = null, orbitOn = false;

function planetPos(w, ang){
  const r = RINGS[w.orbit.i];
  const a = w.orbit.a * Math.PI / 180 + ang;
  return {x: CX + r.rx * Math.cos(a), y: CY + r.ry * Math.sin(a)};
}

function applyPositions(ang){
  GALAXY.worlds.forEach(w => {
    const p = overview.querySelector("[data-world='" + w.id + "']");
    const {x, y} = planetPos(w, ang);
    p.style.transform = "translate(" + x + "px," + y + "px) translate(-50%,-50%)";
  });
}

function orbitTick(t){
  if (!orbitOn) return;
  if (lastFrame != null) orbitAngle += (t - lastFrame) * (2 * Math.PI / ORBIT_PERIOD_MS);
  lastFrame = t;
  applyPositions(orbitAngle);
  updateArcs();
  requestAnimationFrame(orbitTick);
}

function updateOrbitMode(){
  const list = document.body.classList.contains("listmode");
  const shouldRun = !list && !reduceMotion.matches;
  if (shouldRun && !orbitOn){
    orbitOn = true; lastFrame = null;
    requestAnimationFrame(orbitTick);
  } else if (!shouldRun){
    orbitOn = false;
    if (!list) applyPositions(orbitAngle); // park on the orbit — but never in list mode
  }
}
reduceMotion.addEventListener ? reduceMotion.addEventListener("change", updateOrbitMode)
                              : reduceMotion.addListener(updateOrbitMode);

/* ---- layout: scale to fit, or stack on small screens ---- */
const stagewrap = document.querySelector(".stagewrap");
function relayout(){
  const wide = stagewrap.clientWidth >= 780;
  document.body.classList.toggle("listmode", !wide);
  if (wide){
    // fit BOTH dimensions: width (canvas 1200) and height (canvas 780 minus header/legend space)
    const availH = Math.max(430, window.innerHeight - 190);
    const s = Math.min(stagewrap.clientWidth / 1200, availH / 780);
    stage.style.transform = "scale(" + s + ")";
    stagewrap.style.height = (780 * s) + "px";
    updateOrbitMode();
    if (!orbitOn) applyPositions(orbitAngle); // always (re)place: never leave stale coordinates
  } else {
    stage.style.transform = "none";
    stagewrap.style.height = "auto";
    GALAXY.worlds.forEach(w => {
      const p = overview.querySelector("[data-world='" + w.id + "']");
      p.style.transform = ""; // CSS list mode positions statically
    });
    updateOrbitMode();
  }
  updateArcs();
}
window.addEventListener("resize", relayout);
window.addEventListener("orientationchange", relayout);
if (window.ResizeObserver) new ResizeObserver(relayout).observe(stagewrap);
relayout();
</script>
