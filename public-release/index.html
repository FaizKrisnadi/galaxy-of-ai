<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy of AI</title>
<meta name="description" content="A personal, beginner-friendly galaxy for exploring how AI connects to infrastructure, economics, society, governance, politics and the environment. Local prototype; every explanation is short and source-linked.">
<style>
  :root{
    --bg1:#0b1026; --bg2:#141b3d; --ink:#e8edff; --dim:#9aa7d0; --line:#5a6aa3;
    --focus:#a5b4fc; --card:#151d3f; --link:#8ab4ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:radial-gradient(1200px 700px at 60% -10%, #1b2452 0%, var(--bg1) 55%, #070a1a 100%);
    min-height:100vh;padding-top:var(--header-height,64px);
  }
  header{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;z-index:35;max-width:1200px;margin:0 auto;padding:22px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid rgba(154,167,208,.14);background:rgba(11,16,38,.94)}
  .release-note{margin:0;color:#b9c7ef;font-size:12px;text-align:right}
  header h1{margin:0;font-size:20px;line-height:1.2;letter-spacing:-.035em;white-space:nowrap}

  .stagewrap{max-width:1200px;margin:0 auto;padding:0 20px;position:relative;touch-action:none;cursor:grab}
  .stagewrap.dragging{cursor:grabbing}
  body.listmode .stagewrap{touch-action:pan-y;cursor:auto}
  #stage{position:relative;width:1200px;height:780px;transform-origin:top left}
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#cdd7ff;opacity:.7;animation:tw 4s infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}

  #lines{position:absolute;inset:0;pointer-events:none}
  #lines .orbit{fill:none;stroke:#2c3768;stroke-width:1;stroke-dasharray:1 7;opacity:.8}
  #lines .spoke{stroke:#3d4a85;stroke-width:1.5;opacity:.9}
  #lines .spoke.hot{stroke:#8ab4ff;stroke-width:2.5;opacity:1}

  .scene{position:absolute;inset:0;display:none}
  .scene.on{display:block;animation:fadein .35s ease}
  @keyframes fadein{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

  /* ---- overview nodes ---- */
  #sun{position:absolute;left:600px;top:390px;transform:translate(-50%,-50%);width:190px;height:190px;border-radius:50%;
       border:none;cursor:pointer;color:#fff;font:inherit;
       background:radial-gradient(circle at 35% 30%,#fff8df 0%,#ffe9a2 20%,#f4b862 53%,#d6774b 80%,#973d45 100%);
       box-shadow:0 0 46px 12px rgba(251,191,36,.45), 0 0 140px 40px rgba(251,191,36,.14);
       animation:pulse 5s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 46px 12px rgba(251,191,36,.45),0 0 140px 40px rgba(251,191,36,.14)}
                   50%{box-shadow:0 0 60px 18px rgba(251,191,36,.6),0 0 170px 50px rgba(251,191,36,.2)}}
  #sun .t{display:block;font-size:26px;font-weight:800;text-shadow:0 1px 8px rgba(120,60,0,.5)}
  #sun .s{display:block;font-size:11.5px;margin-top:2px;color:#7c2d12;font-weight:600}

  .planet{position:absolute;left:0;top:0;border:none;cursor:pointer;color:var(--ink);
          font:inherit;background:transparent;padding:6px;text-align:center;width:170px;will-change:transform}
  .planet .ball{position:relative;overflow:hidden;width:86px;height:86px;margin:0 auto 6px;border-radius:50%;display:block;
                box-shadow:inset -16px -14px 24px rgba(3,8,24,.58),inset 3px 3px 9px rgba(255,255,255,.22),0 0 25px color-mix(in srgb,var(--planet-color),transparent 73%);
                transition:transform .18s ease, box-shadow .18s ease}
  .planet .ball::after{content:'';position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(155deg,transparent 0 13px,rgba(255,255,255,.11) 14px 16px,transparent 19px 28px),radial-gradient(ellipse at 25% 25%,rgba(255,255,255,.22),transparent 42%);mix-blend-mode:screen;opacity:.65;pointer-events:none}
  .planet:nth-child(even) .ball::after{transform:rotate(55deg);opacity:.4}
  .planet .t{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
  .planet .s{display:block;font-size:11px;color:var(--dim);margin-top:1px}
  .planet:hover .ball,.planet:focus-visible .ball{transform:scale(1.1);box-shadow:inset -14px -12px 26px rgba(0,0,0,.55),0 0 34px rgba(165,180,252,.55)}

  /* ---- world scene ---- */
  .world-core{position:absolute;transform:translate(-50%,-50%);width:170px;height:170px;border-radius:50%;
              border:none;cursor:pointer;color:#0b1026;font:inherit;font-weight:800;font-size:17px;
              box-shadow:0 0 40px 6px rgba(148,163,255,.35)}
  .world-core .go{display:block;font-size:11px;font-weight:600;margin-top:2px;opacity:.75}
  .topic{position:absolute;transform:translate(-50%,-50%);width:190px;border-radius:14px;cursor:pointer;
         font:inherit;text-align:center;color:var(--ink);padding:10px 12px;
         background:rgba(21,29,63,.92);border:1.5px solid #3d4a85;transition:border-color .15s,box-shadow .15s}
  .topic:hover,.topic:focus-visible{border-color:var(--focus);box-shadow:0 0 20px rgba(138,180,255,.35)}
  .topic .t{display:block;font-size:13.5px;font-weight:700;line-height:1.3}
  .topic .s{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
  .topic.connected{border-color:var(--focus);box-shadow:0 0 18px rgba(138,180,255,.5)}
  .topic.soft{opacity:.4}
  .planet{transition:opacity .25s}
  .planet.faded{opacity:.25}
  .planet.faded:hover .ball,.planet.faded:focus-visible .ball{transform:none}
  .planet.focal .t,.planet.focal .s{visibility:hidden}
  .planet.linked .ball{box-shadow:inset -14px -12px 26px rgba(0,0,0,.55),0 0 34px rgba(165,180,252,.9)}
  #expansion{position:absolute;inset:0;pointer-events:none;z-index:5}
  #expansion .topic{pointer-events:auto}
  .xcross{fill:none;stroke-width:2;opacity:.85}
  .xcross.solid{stroke:#9db4ff}
  .xcross.dotted{stroke:#8d99c9;stroke-dasharray:4 6}
  .crumb-btn{position:absolute;top:10px;left:12px;z-index:26;background:rgba(21,29,63,.9);border:1px solid #3d4a85;
             color:var(--link);font:inherit;font-size:13.5px;border-radius:10px;padding:6px 12px;cursor:pointer}
  .crumb-btn:hover,.crumb-btn:focus-visible{color:var(--focus);border-color:var(--focus)}
  .journeybar{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .jbtn{border:1px solid rgba(154,167,208,.24);background:rgba(255,255,255,.035);color:#dbe3ff;font:inherit;font-size:13px;border-radius:10px;padding:9px 14px;cursor:pointer;transition:background .15s,border-color .15s}
  .jbtn:hover,.jbtn:focus-visible{border-color:var(--focus);background:rgba(165,180,252,.1);color:#fff}
  .jbtn.active{border-color:#fbbf24;color:#fbbf24;background:rgba(251,191,36,.1)}
  .guide{position:fixed;left:22px;bottom:18px;z-index:45;transform-origin:top left}
  .guide-toggle{touch-action:none;user-select:none;display:block;width:100px;height:110px;padding:0;border:0;background:transparent;cursor:pointer;animation:guide-float 4.5s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
  .guide-hello{position:absolute;bottom:95px;left:72px;white-space:nowrap;color:#eef2ff;background:rgba(31,43,75,.96);border:1px solid rgba(207,221,255,.22);padding:8px 12px;border-radius:14px;font-size:12px;box-shadow:0 6px 22px rgba(0,0,0,.25);pointer-events:none}
  .guide.open .guide-hello{display:none}
  #future-quiz{margin-top:12px;border-top:1px solid rgba(207,221,255,.15);padding-top:12px}
  #future-quiz p{font-size:13px;line-height:1.45;margin:8px 0}
  #future-quiz button{display:block;width:100%;margin:5px 0;padding:8px;text-align:left;border:1px solid rgba(207,221,255,.18);border-radius:9px;background:rgba(255,255,255,.04);color:#eef2ff;cursor:pointer}
  #future-quiz .scale{height:6px;border-radius:8px;background:linear-gradient(90deg,#d97783,#e8bd76,#68bfae);margin:15px 2px;position:relative}
  #future-quiz .marker{position:absolute;top:-4px;width:3px;height:14px;background:white}
  .guide-menu{max-height:min(70vh,550px);overflow:auto}
  .guide-toggle img{display:block;width:100%;height:100%;object-fit:contain}
  .guide-toggle:focus-visible{outline:2px solid var(--focus);outline-offset:4px;border-radius:20px}
  @keyframes guide-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
  .guide-menu{display:none;position:absolute;left:10px;bottom:112px;width:260px;padding:16px;background:rgba(21,29,63,.97);border:1px solid #485583;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.42)}
  .guide.open .guide-menu{display:block}
  .guide-menu h2{margin:0 0 10px;font-size:15px;line-height:1.3;letter-spacing:-.01em}
  .guide-menu .jbtn small{display:block;margin-top:3px;color:#aebddb;font-size:11px;font-weight:400}
  .guide-menu .jbtn{display:block;width:100%;margin-top:7px;text-align:left;padding:10px 12px}
  body:has(#jpanel.on) .guide{left:max(370px,calc((100vw - 1240px)/2 + 354px))}

  @media(max-width:779px){.guide{left:10px;bottom:10px}.guide-toggle{width:76px;height:84px}.guide-menu{bottom:86px;width:min(260px,calc(100vw - 40px))}}
  .searchwrap{position:relative;margin-bottom:10px}
  .search-toggle{width:40px;height:40px;display:grid;place-items:center;border:1px solid rgba(154,167,208,.24);border-radius:10px;background:rgba(255,255,255,.035);color:var(--ink);cursor:pointer}
  .search-toggle:hover,.search-toggle:focus-visible{border-color:var(--focus);background:rgba(165,180,252,.1)}
  .search-panel{display:none;position:absolute;right:0;top:calc(100% + 8px);width:min(280px,calc(100vw - 40px));z-index:40}
  .searchwrap.open .search-panel{display:block}
  #search{width:100%;background:#151d3f;border:1px solid rgba(154,167,208,.3);color:var(--ink);
          font:inherit;font-size:13px;border-radius:10px;padding:9px 14px;outline:none}
  #search:focus-visible{border-color:var(--focus)}
  #search::placeholder{color:var(--dim)}
  #results{position:absolute;top:calc(100% + 6px);right:0;z-index:40;background:var(--card);border:1px solid #2e3a6e;border-radius:12px;
           box-shadow:0 12px 40px rgba(0,0,0,.5);overflow:hidden;display:none;width:max(100%,250px);max-width:calc(100vw - 40px)}
  @media (max-width:779px){header{align-items:stretch;flex-direction:column;gap:14px;padding-top:18px}.journeybar{justify-content:flex-start}.jbtn{flex:1;text-align:center}}
  #results.on{display:block}
  #results button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);
                  font:inherit;font-size:13.5px;padding:8px 12px;cursor:pointer}
  #results button:hover,#results button:focus-visible{background:rgba(165,180,252,.12);color:var(--focus)}
  #results .where{color:var(--dim);font-size:11.5px;display:block}
  .jnode{border-color:#fbbf24!important;box-shadow:0 0 0 3px rgba(251,191,36,.35),0 0 22px rgba(251,191,36,.5)!important}
  .jtrail{fill:none;stroke:#fbbf24;stroke-width:2.5;opacity:.9;stroke-dasharray:2 4}
  #jpanel{position:fixed;left:max(16px,calc((100vw - 1240px)/2));bottom:16px;width:340px;max-height:46vh;overflow:auto;
          background:var(--card);border:1px solid #2e3a6e;border-radius:14px;padding:14px 16px;
          box-shadow:0 14px 50px rgba(0,0,0,.55);display:none;z-index:28}
  #jpanel.on{display:block}
  #jpanel .step{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:#fbbf24;font-weight:700}
  #jpanel h3{margin:2px 0 4px;font-size:16px}
  #jpanel p{margin:6px 0;font-size:13.5px}
  #jpanel .srclab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:10px 0 2px}
  #jpanel .note{color:var(--dim);font-size:12px;font-style:italic}
  #jpanel ul{margin:4px 0;padding-left:18px}
  #jpanel li{font-size:12.5px;margin:3px 0}
  #jpanel a{color:var(--link)}
  #jpanel .row{display:flex;gap:8px;margin-top:10px}
  #jpanel .row button{flex:1;border:1px solid #3d4a85;background:rgba(21,29,63,.7);color:var(--ink);
                      font:inherit;font-size:13px;border-radius:10px;padding:6px 8px;cursor:pointer}
  #jpanel .row button:hover:not(:disabled),#jpanel .row button:focus-visible{border-color:var(--focus);color:var(--focus)}
  #jpanel .row button:disabled{opacity:.4;cursor:default}
  #jpanel .full{border:none;background:none;color:var(--link);font:inherit;font-size:12.5px;cursor:pointer;padding:0;margin-top:8px}
  #jpanel .full:hover,#jpanel .full:focus-visible{color:var(--focus)}

  .topiclink{fill:none;stroke-width:1.8;opacity:.8}
  .topiclink.solid{stroke:#7f8ec4}
  .topiclink.dotted{stroke:#8d99c9;stroke-dasharray:3 6}
  .topiclink.hot{stroke:#a5b4fc;stroke-width:3;opacity:1}
  .arc{fill:none;stroke:#8faee8;stroke-width:1.5;opacity:.55;stroke-linecap:round}
  .arc.dotted{stroke:#8994c4;stroke-dasharray:2 7;opacity:.5}

  .crumb{position:absolute;top:6px;left:8px;font-size:13.5px;color:var(--dim)}
  .crumb button{background:none;border:none;color:var(--link);font:inherit;font-size:13.5px;cursor:pointer;padding:6px 8px;border-radius:8px}
  .crumb button:hover,.crumb button:focus-visible{color:var(--focus);outline:none;background:rgba(165,180,252,.12)}

  /* ---- topic card ---- */
  #card{position:fixed;top:70px;right:max(16px,calc((100vw - 1240px)/2));width:400px;max-height:calc(100vh - 100px);
        overflow:auto;background:var(--card);border:1px solid #2e3a6e;border-radius:16px;padding:18px 20px;
        box-shadow:0 18px 60px rgba(0,0,0,.55);display:none;z-index:30}
  #card.on{display:block;animation:slidein .28s ease}
  @keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
  #card .crumb2{font-size:12.5px;color:var(--dim);margin-bottom:6px}
  #card .crumb2 button{background:none;border:none;color:var(--link);font:inherit;font-size:12.5px;cursor:pointer;padding:2px 0}
  #card h2{margin:0 0 2px;font-size:19px}
  #card .tag{color:var(--dim);font-size:13px;margin:0 0 8px}
  #card p{margin:8px 0;font-size:14px}
  #card .unk{color:#c7b98a;font-size:13px;font-style:italic;margin:10px 0 0}
  #card .recs li{margin:6px 0}
  #card .recs .tier{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;margin-right:5px;vertical-align:1px}
  #card .recs .t-F{background:#dcfce7;color:#166534}
  #card .recs .t-V,#card .recs .t-O{background:#dbeafe;color:#1e40af}
  #card .recs .t-L,#card .recs .t-S{background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0}
  #card .recs .t-H,#card .recs .t-D{background:#f1f5f9;color:#64748b}
  #card .absence{color:var(--dim);font-size:12.5px;font-style:italic}
  #card .srcline{font-size:13px;color:var(--dim);margin:10px 0 0}
  #card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:16px 0 4px}
  #card ul{margin:4px 0;padding-left:18px}
  #card li{margin:5px 0;font-size:13.5px}
  #card a{color:var(--link)}
  #card .xlink{background:none;border:none;color:var(--link);font:inherit;font-size:13.5px;cursor:pointer;padding:0;text-align:left;display:block;margin:6px 0}
  #card .xlink:hover,#card .xlink:focus-visible{color:var(--focus)}
  #card .xlink.dotted i{border-bottom:1px dotted var(--link)}
  #card .xlink i{font-style:normal}
  #card .xlink .where{color:var(--dim);font-size:12px}
  #card .close{position:sticky;top:0;float:right;background:rgba(21,29,63,.9);border:1px solid #3d4a85;color:var(--ink);
               border-radius:8px;width:30px;height:30px;font-size:15px;cursor:pointer;line-height:1}
  #card .close:hover,#card .close:focus-visible{border-color:var(--focus);color:var(--focus)}



  #card{background:linear-gradient(155deg,#192342,#111a35 65%);border:1px solid rgba(166,185,240,.2);border-radius:22px;padding:24px;box-shadow:0 22px 70px rgba(0,0,0,.55)}
  #card h2{font-size:26px;line-height:1.12;letter-spacing:-.035em;margin:14px 0 6px}
  #card .tag{font-size:12px;color:#aebee4;margin-bottom:22px}
  #card .story p{font-size:15px;line-height:1.7;color:#e4eaff;margin:0 0 14px}
  #card .unk{font-style:normal;color:#ded0a3;background:rgba(226,191,107,.07);border:1px solid rgba(226,191,107,.13);border-radius:14px;padding:12px 14px;line-height:1.55}
  #card h3{margin:25px 0 10px;font-size:11px;letter-spacing:.1em}
  #card .chapter,#card .source-drawer{border-top:1px solid rgba(168,185,231,.17);padding:13px 0}
  #card .chapter summary,#card .source-drawer summary{cursor:pointer;list-style:none;font-size:14px;font-weight:650;display:flex;justify-content:space-between;gap:12px}
  #card .chapter summary::-webkit-details-marker,#card .source-drawer summary::-webkit-details-marker{display:none}
  #card .chapter summary:after{content:'+';font-size:18px;color:#a8bdf1}
  #card .chapter[open] summary:after{content:'−'}
  #card .chapter p{color:#becbeb;line-height:1.65;margin:10px 0}
  #card .chapter a,#card .source-drawer a{font-size:13px;color:#a9c5ff}
  #card .related-list{display:grid;gap:7px}
  #card .xlink{margin:0;padding:12px 14px;border:1px solid rgba(168,185,231,.17);border-radius:12px;background:rgba(255,255,255,.035);display:flex;align-items:center;justify-content:space-between;color:#eef2ff;gap:12px}
  #card .xlink:hover,#card .xlink:focus-visible{border-color:#a5b4fc;background:rgba(165,180,252,.1)}
  #card .xlink small,#card .source-drawer small{display:block;color:#9eadd0;font-size:11px;font-weight:400;margin-top:3px}
  #card .source-drawer{margin-top:24px}
  #card .source-drawer p{font-size:12px;color:#a9b8db}
  #card .source-drawer li{margin:12px 0;overflow-wrap:anywhere}


  #card .reading-section{margin-top:28px}
  #card .reading-section h3{display:flex;align-items:center;justify-content:space-between;color:#d8e2ff;font-size:13px;letter-spacing:.04em}
  #card .reading-section h3 span{font-size:11px;color:#a4b2d6}
  #card .reading{padding:16px 0;border-top:1px solid rgba(168,185,231,.17)}
  #card .reading a{font-size:15px;line-height:1.4;font-weight:650;color:#dbe7ff;text-decoration:none}
  #card .reading a:hover,#card .reading a:focus-visible{color:#b6cbff;text-decoration:underline}
  #card .reading p{color:#bdc9e4;font-size:13.5px;line-height:1.6;margin:7px 0}
  #card .audit-detail{margin-top:9px;color:#aebee4;font-size:12px}
  #card .audit-detail summary{cursor:pointer}
  #card .audit-detail p{white-space:pre-line;font-size:12px;color:#bdc9e4}
  #card .reading small{display:block;color:#8fa3ce;font-size:11px;line-height:1.4}
  #card .related-drawer{margin-top:22px;padding:14px 0;border-top:1px solid rgba(168,185,231,.17)}
  #card .related-drawer summary{cursor:pointer;display:flex;justify-content:space-between;font-size:13px;color:#aebee4}
  #card .related-drawer .related-list{margin-top:12px}


  /* A quieter, consistent panel inspired by native macOS surfaces. */
  #card{background:rgba(25,34,58,.92);backdrop-filter:blur(28px) saturate(135%);-webkit-backdrop-filter:blur(28px) saturate(135%);border:1px solid rgba(216,226,255,.13);box-shadow:0 24px 70px rgba(0,0,0,.38);border-radius:20px}
  #card .close{border:0;background:rgba(255,255,255,.09);border-radius:50%;width:32px;height:32px}
  #card .unk{background:rgba(255,255,255,.055);border:0;border-radius:13px;color:#d3dbee;padding:14px 15px}
  #card .reading{border-color:rgba(226,235,255,.1)}
  #card .reading a{color:#edf2ff;letter-spacing:-.01em}
  #card .reading p{color:#bfc9dc}
  #card .audit-detail summary{color:#aebfdf}
  #card .xlink{border-color:rgba(225,235,255,.1);background:rgba(255,255,255,.045)}
  #card .chapter,#card .source-drawer,#card .related-drawer{border-color:rgba(225,235,255,.1)}


  #card .reading-detail{border-top:1px solid rgba(225,235,255,.09);padding:8px 0;color:#b8c7e2;font-size:12px}
  #card .reading-detail summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-weight:600}
  #card .reading-detail summary::-webkit-details-marker{display:none}
  #card .reading-detail summary::after{content:'+';font-size:15px;color:#aebee4}
  #card .reading-detail[open] summary::after{content:'−'}

        { id:"jobs", title:"AI exposure & jobs", tagline:"exposure is not job loss",

            "<p>\u201cAI exposure\u201d means how much of a job\u2019s tasks AI could do or change \u2014 it is not the same as losing a job.</p>",
            "<p>A US Census Bureau working paper (Sep 2026, administrative records) found that after ChatGPT\u2019s introduction, graduates in the most AI-exposed tenth of college majors saw their likelihood of initial employment decline by five percentage points, and full-quarter initial earnings decline by thirteen percent \u2014 a hit the authors compare to graduating into a large recession. Effects fade as graduates move further from entry but stay substantial for the most exposed.</p>"

          unknown:"The comparison cannot cleanly separate AI from everything else changing at the same time \u2014 a documented correlation, not proven cause.",

        { id:"productivity", title:"Productivity", tagline:"does AI make us more productive?",
          body:[
            "<p>An IMF working paper used AI-related patents from 2000\u20132017 \u2014 before today\u2019s AI \u2014 and estimated that historical AI innovation was associated with roughly 0.8\u20131.2% higher output per worker.</p>"
          ],
          unknown:"That is a past, patent-based association \u2014 not a measurement of today\u2019s generative AI boom.",
          sources:[{label:"IMF Working Paper 2026/204 \u2014 AI and aggregate labour productivity", url:"https://www.imf.org/en/publications/wp/issues/2026/09/25/artificial-intelligence-and-aggregate-labor-productivity-evidence-from-patent-data-579850"}] },
        { id:"ownership", title:"Ownership & market power", tagline:"who controls the stack",
          body:[
            "<p>A few companies control much of the chips, cloud and models that everyone else depends on. For public agencies buying AI, interviews with 38 EU/US experts point to the decisive levers being contractual: who owns the data, who can audit, and who can exit.</p>"

            {to:"economics/investment", label:"the capital behind market power"},
            {to:"governance/procurement", label:"procurement is where this lands"}

        { id:"evidence", title:"Reading the evidence", tagline:"what studies can and cannot say",
          body:[
            "<p>Most numbers in this galaxy come with fine print. The US Census study uses administrative records yet still cannot fully separate AI from everything else changing at once; the IMF estimate rests on pre-2020 patents; the open-source findings are self-reported by surveyed developers.</p>",

const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs){
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

/* stars — deterministic so they don't reshuffle on resize */
(function stars(){
  let s = 42; const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const box = document.getElementById("stars");
  for (let i = 0; i < 110; i++){
    const d = document.createElement("i");
    d.className = "star";
    d.style.left = (rnd() * 100) + "%";
    d.style.top = (rnd() * 100) + "%";
    d.style.animationDelay = (rnd() * 4).toFixed(2) + "s";
    d.style.opacity = (0.25 + rnd() * 0.6).toFixed(2);
    box.appendChild(d);
  }
})();

/* ---- overview ---- */
const CX = 600, CY = 390;
const RINGS = [{rx:235, ry:150}, {rx:370, ry:235}, {rx:495, ry:325}];
RINGS.forEach(({rx, ry}) => {
  linesSvg.appendChild(svgEl("ellipse", {class:"orbit", cx:CX, cy:CY, rx, ry}));
});

GALAXY.worlds.forEach(w => {
  const b = document.createElement("button");
  b.className = "planet";
  b.dataset.world = w.id;
  b.innerHTML = "<span class='ball' style='--planet-color:" + w.color + ";background:radial-gradient(circle at 30% 27%, " + w.color + " 0%, " +
    w.color + "dd 30%, #1a2345 100%)'></span><span class='t'>" + w.title + "</span><span class='s'>" + w.tagline + "</span>";
  b.addEventListener("click", () => expandWorld(w.id));
  overview.appendChild(b);
});

/* ---- faint arcs between worlds whose topics are connected ---- */
const arcsG = svgEl("g", {id:"arcs"});
linesSvg.appendChild(arcsG);
const ARC_PAIRS = [];
(function buildArcPairs(){
  const seen = {};
  GALAXY.worlds.forEach(w => w.topics.forEach(t => (t.links || []).forEach(l => {
    const tw = l.to.split("/")[0];
    if (tw === w.id || !GALAXY.worlds.some(x => x.id === tw)) return;
    const key = [w.id, tw].sort().join("|");
    if (!seen[key]){
      seen[key] = {a:w.id, b:tw, dotted:true, n:0};
      ARC_PAIRS.push(seen[key]);
    }
    seen[key].n++;
    if (!l.dotted) seen[key].dotted = false;
  })));
  const NAME = {}; GALAXY.worlds.forEach(w => NAME[w.id] = w.title);
  ARC_PAIRS.forEach(pr => {
    const path = svgEl("path", {class:"arc" + (pr.dotted ? " dotted" : "")});
    const tip = svgEl("title");
    tip.textContent = NAME[pr.a] + " \u2194 " + NAME[pr.b] + " \u2014 " + pr.n + " topic connection" + (pr.n > 1 ? "s" : "");
    path.appendChild(tip);
    pr.el = path;
    arcsG.appendChild(path);
  });
})();

function updateArcs(){
  const show = overview.classList.contains("on") && !document.body.classList.contains("listmode");
  arcsG.style.display = show ? "" : "none";
  if (!show) return;
  ARC_PAIRS.forEach(pr => {
    const A = planetPos(GALAXY.worlds.find(x => x.id === pr.a), orbitAngle);
    const B = planetPos(GALAXY.worlds.find(x => x.id === pr.b), orbitAngle);
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const dx = mx - CX, dy = my - CY;
    const dl = Math.hypot(dx, dy) || 1;
    const cx = mx + dx / dl * 42, cy = my + dy / dl * 42;
    pr.el.setAttribute("d", "M" + A.x + "," + A.y + " Q" + cx + "," + cy + " " + B.x + "," + B.y);
  });
}

/* ---- in-canvas expansion: topics open around their planet ---- */
let expanded = null;      // world id or null
let expLayout = null;     // {pin:{x,y}, topics:[{t,x,y}]}
let openRef = null;       // currently open topic ref, for redraws

function worldById(id){ return GALAXY.worlds.find(x => x.id === id); }

function layoutExpansion(){
  const w = worldById(expanded);
  if (!w || !expLayout) return;
  const P = expLayout.pin;
  const lx = P.x + (CX - P.x) * 0.5;
  const ly = P.y + (CY - P.y) * 0.5;
  const n = w.topics.length;
  w.topics.forEach((t, i) => {
    const ang = -Math.PI/2 + i * 2 * Math.PI / n;
    let x = lx + 310 * Math.cos(ang);
    let y = ly + 215 * Math.sin(ang) * (n <= 3 ? 0.8 : 1);
    x = Math.max(105, Math.min(1095, x));
    y = Math.max(64, Math.min(716, y));
    t._x = x; t._y = y;
    const o = expLayout.topics.find(q => q.t === t);
    if (o){ o.x = x; o.y = y; }
  });
}

function drawExpansionLines(){
  linesSvg.querySelectorAll(".spoke.hot,.topiclink").forEach(e => e.remove());
  const w = worldById(expanded);
  const P = expLayout.pin;
  w.topics.forEach(t => {
    linesSvg.appendChild(svgEl("line", {class:"spoke hot", x1:P.x, y1:P.y, x2:t._x, y2:t._y}));
  });
  w.topics.forEach(t => (t.links || []).forEach(l => {
    if (!l.to.startsWith(w.id + "/")) return;
    const other = w.topics.find(x => w.id + "/" + x.id === l.to);
    if (!other) return;
    const mx = (t._x + other._x) / 2, my = (t._y + other._y) / 2;
    const dx = other._x - t._x, dy = other._y - t._y;
    const len = Math.hypot(dx, dy) || 1;
    const cx = mx + (-dy / len) * 30, cy = my + (dx / len) * 30;
    const p = svgEl("path", {class:"topiclink " + (l.dotted ? "dotted" : "solid"),
      d:"M" + t._x + "," + t._y + " Q" + cx + "," + cy + " " + other._x + "," + other._y});
    p.dataset.a = w.id + "/" + t.id;
    p.dataset.b = l.to;
    linesSvg.appendChild(p);
  }));
}

function expandWorld(id){
  if (expanded === id){ collapse(); return; }
  if (expanded) collapse(true);
  expanded = id;
  const w = worldById(id);
  const P = planetPos(w, orbitAngle);
  expLayout = {pin:{x:P.x, y:P.y}, topics: w.topics.map(t => ({t, x:0, y:0}))};
  layoutExpansion();
  overview.querySelectorAll(".planet").forEach(el => {
    el.classList.toggle("faded", el.dataset.world !== id);
    el.setAttribute("aria-expanded", el.dataset.world === id ? "true" : "false");
  });
  const pw = overview.querySelector("[data-world='" + id + "']");
  pw.style.transform = "translate(" + P.x + "px," + P.y + "px) translate(-50%,-50%)"; // pinned
  pw.classList.add("focal");
  drawExpansionLines();
  expLayout.topics.forEach(({t, x, y}) => {
    const el = document.createElement("button");
    el.className = "topic exp";
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.dataset.topic = id + "/" + t.id;
    el.innerHTML = "<span class='t'>" + t.title + "</span><span class='s'>" + t.tagline + "</span>";
    el.addEventListener("click", () => openCard(id + "/" + t.id));
    expansion.appendChild(el);
  });
  arcsG.style.display = "none";
  collapseBtn.hidden = false;
  collapseBtn.innerHTML = "&#8592; Collapse " + w.title;
  hideCard();
  updateOrbitMode();
  if (!document.body.classList.contains("listmode")){
    const first = expansion.querySelector(".topic");
    if (first) first.focus();
  }
}

function collapse(keepCard){
  if (!expanded) return;
  const id = expanded;
  expanded = null; expLayout = null; openRef = null;
  expansion.innerHTML = "";
  linesSvg.querySelectorAll(".spoke.hot,.topiclink,.xcross").forEach(e => e.remove());
  overview.querySelectorAll(".planet").forEach(el => {
    el.classList.remove("faded", "linked", "focal");
    el.setAttribute("aria-expanded", "false");
  });
  arcsG.style.display = "";
  collapseBtn.hidden = true;
  if (!keepCard) hideCard();
  updateOrbitMode();
  applyPositions(orbitAngle);
  if (!keepCard){
    const b = overview.querySelector("[data-world='" + id + "']");
    if (b) b.focus();
  }
}

collapseBtn.addEventListener("click", () => collapse());
