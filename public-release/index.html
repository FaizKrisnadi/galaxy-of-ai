 {axis:'outlook',q:'The long-term risks of AI concern me more than its potential benefits excite me.',dir:-1},
 {axis:'outlook',q:'Society can make choices that allow the benefits of AI to reach many people.',dir:1}
];
let futureStep=0, futureAnswers=Array(futureQuestions.length).fill(null), sharedProfile=null;
function renderFuture(){
  if (futureStep === futureQuestions.length){
    const profile = sharedProfile || outlookAxes.map(axis=>{
      const vals=futureQuestions.map((q,i)=>q.axis===axis.id && futureAnswers[i]!==null ? (q.dir===1 ? futureAnswers[i] : 4-futureAnswers[i]) : null).filter(v=>v!==null);
      return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/(vals.length*4)*100) : null;
    });
    let html="<p class='outlook-kicker'>YOUR AI PROFILE</p><h2 id='outlook-title' tabindex='-1'>Your view, in six perspectives.</h2><p class='result-intro'>Your answers don’t have to fit a single label. Here’s where they take you.</p><div class='result-overview'>";
    outlookAxes.forEach((axis,i)=>{
      const pct=profile[i];html+="<div class='result-row'><div class='result-row-head'><strong>"+axis.title+"</strong><span>"+(pct===null?'No answer':pct<40?axis.left:pct>60?axis.right:'Between the two')+"</span></div>";
      if(pct!==null)html+="<div class='axis-track'><span style='left:"+pct+"%'></span></div><div class='axis-labels'><span>"+axis.left+"</span><span>"+axis.right+"</span></div>";
      html+="</div>";
    });
    html+="</div><details class='result-details'><summary>See your results in detail</summary><p>The markers summarise your answers on each axis. They are not probabilities or a validated psychological score.</p>";
    outlookAxes.forEach((axis,i)=>{html+="<div class='axis-result'><strong>"+axis.title+"</strong><p>From "+axis.left.toLowerCase()+" to "+axis.right.toLowerCase()+".</p>"+(byTopic[axis.topic]?"<button class='axis-link' data-topic-link='"+axis.topic+"'>Explore related reading ↗</button>":"")+"</div>"});
    html+="</details><section class='outlook-facts'><p class='outlook-kicker'>A WIDER PICTURE</p><h3>Did you know?</h3><p>In Ipsos’s 2025 survey, an average of <strong>52%</strong> across 30 countries said AI products and services made them excited; <strong>53%</strong> said AI made them nervous. These are separate questions, so both feelings can coexist.</p><a href='https://www.ipsos.com/en/conflicting-global-perceptions-around-ai-present-mixed-signals-brands' target='_blank' rel='noopener noreferrer'>Read the Ipsos findings ↗</a><p class='fact-note'>These survey results describe their respondents; they are not a direct comparison with this test.</p></section>";
    html+="<section class='share-section'><p class='outlook-kicker'>KEEP THE CONVERSATION GOING</p><h3>Share your perspective.</h3><p>Invite someone to take the test, or share a link to this result.</p><div class='share-actions'><button id='share-result'>Copy result link</button><button id='share-x'>Share on X</button></div><p id='share-status' class='fact-note' aria-live='polite'></p><p class='fact-note'>A result link includes your six summary positions. Anyone with it can see them. No individual answers are included.</p></section><div class='outlook-actions'><button id='future-back'>Review answers</button><button id='future-again'>Start again</button></div><footer class='outlook-footer'>© Faiz Krisnadi · Galaxy of AI</footer>";
    futureQuiz.innerHTML=html;
    document.getElementById('future-again').onclick=()=>{sharedProfile=null;futureStep=0;futureAnswers=Array(futureQuestions.length).fill(null);document.getElementById('return-outlook').hidden=true;renderFuture()};
    document.getElementById('future-back').onclick=()=>{if(sharedProfile){sharedProfile=null;futureStep=0;futureAnswers=Array(futureQuestions.length).fill(null)}else futureStep--;renderFuture()};
    futureQuiz.querySelectorAll('[data-topic-link]').forEach(b=>b.onclick=()=>{const ref=b.dataset.topicLink;outlookOverlay.hidden=true;document.getElementById('return-outlook').hidden=false;closeGuide();exitJourney();expandWorld(ref.split('/')[0]);openCard(ref)});
    const shareLink=()=>{if(!/^https?:$/.test(location.protocol)){document.getElementById('share-status').textContent='Sharing needs a published website address. This local preview cannot create a link other people can open.';return null}const url=new URL(location.href);url.hash='result='+profile.map(v=>v===null?'x':v).join(',');return url.href};
    document.getElementById('share-result').onclick=async()=>{const url=shareLink();if(!url)return;try{await navigator.clipboard.writeText(url);document.getElementById('share-status').textContent='Result link copied.'}catch(e){document.getElementById('share-status').textContent='Copy this result link: '+url}};
    document.getElementById('share-x').onclick=()=>{const url=shareLink();if(!url)return;const message='Explore your AI outlook and the Galaxy of AI.';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(message)+'&url='+encodeURIComponent(url),'_blank','noopener,noreferrer')};
  } else {
    const item=futureQuestions[futureStep], choices=['Strongly disagree','Disagree','Neutral','Agree','Strongly agree','Unsure'];
    futureQuiz.innerHTML="<p class='outlook-kicker'>AI OUTLOOK · "+(futureStep+1)+" / "+futureQuestions.length+"</p><div class='outlook-progress' aria-hidden='true'><span style='width:"+((futureStep/futureQuestions.length)*100)+"%'></span></div><h2 id='outlook-title' tabindex='-1'>"+item.q+"</h2><div class='answer-list'>"+choices.map((a,i)=>"<button data-answer='"+i+"'"+(futureAnswers[futureStep]===i&&i<5?" aria-current='true'":"")+">"+a+"</button>").join('')+"</div>"+(futureStep?"<button class='outlook-back' id='future-back'>← Previous question</button>":"<p class='outlook-note'>18 statements · Your answers stay in this page.</p>");
    futureQuiz.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.answer);futureAnswers[futureStep]=n===5?null:n;futureStep++;renderFuture()});
    if(futureStep)document.getElementById('future-back').onclick=()=>{futureStep--;renderFuture()};
  }
  futureQuiz.closest('.outlook-dialog').scrollTop=0;
  document.getElementById('outlook-title').focus();
}
function showOutlookIntro(){
  futureQuiz.innerHTML = "<p class='outlook-kicker'>GALAXY OF AI · A PERSONAL EXPLORATION</p><h2 id='outlook-title' tabindex='-1'>Where do you stand on AI?</h2><p class='outlook-lede'>AI brings possibilities, trade-offs and uncertainty. Explore the ideas behind your own outlook — one question at a time.</p><div class='intro-facts'><span><b>18</b> statements</span><span><b>6</b> perspectives</span><span><b>~3</b> minutes</span></div><button id='outlook-begin' class='outlook-begin'>Start the test <span aria-hidden='true'>→</span></button><p class='outlook-note'>There are no right answers. This is a reflection tool, not a scientific test. Your answers stay in this page.</p>";
  document.getElementById('outlook-begin').addEventListener('click',renderFuture);
  futureQuiz.closest('.outlook-dialog').scrollTop=0;
  document.getElementById('outlook-title').focus();
}
document.getElementById('future-start').addEventListener('click',()=>{closeGuide();outlookOverlay.hidden=false;sharedProfile=null;futureStep=0;futureAnswers=Array(futureQuestions.length).fill(null);document.getElementById('return-outlook').hidden=true;showOutlookIntro()});
document.getElementById('return-outlook').addEventListener('click',()=>{document.getElementById('return-outlook').hidden=true;outlookOverlay.hidden=false;futureStep=futureQuestions.length;renderFuture()});
const resultHash=location.hash.match(/^#result=(x|\d{1,3})(,(?:x|\d{1,3})){5}$/);
if(resultHash){const parsed=location.hash.slice(8).split(',').map(x=>x==='x'?null:Number(x));if(parsed.every(v=>v===null||(v>=0&&v<=100))){sharedProfile=parsed;futureStep=futureQuestions.length;outlookOverlay.hidden=false;renderFuture()}}
document.getElementById('outlook-close').addEventListener('click',()=>{outlookOverlay.hidden=true;guideToggle.focus()});
outlookOverlay.addEventListener('click',e=>{if(e.target===outlookOverlay){outlookOverlay.hidden=true;guideToggle.focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!outlookOverlay.hidden){e.stopPropagation();outlookOverlay.hidden=true;guideToggle.focus()}});
document.getElementById('surprise-topic').addEventListener('click',()=>{const keys=Object.keys(byTopic);const ref=keys[Math.floor(Math.random()*keys.length)];exitJourney();expandWorld(ref.split('/')[0]);openCard(ref);closeGuide()});

/* ---- simple topic search ---- */
const searchInput = document.getElementById("search");
const resultsBox = document.getElementById("results");
const searchWrap = document.querySelector('.searchwrap');
function closeSearch(){resultsBox.classList.remove('on');resultsBox.innerHTML='';searchInput.value=''}
document.addEventListener('click',e=>{if(!searchWrap.contains(e.target))closeSearch()});

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2){ resultsBox.classList.remove("on"); resultsBox.innerHTML = ""; return; }
  const hits = [];
  GALAXY.worlds.forEach(w => w.topics.forEach(t => {
    if ((t.title + " " + t.tagline + " " + w.title + " " + t.body.join(" ").replace(/<[^>]+>/g, " ")).toLowerCase().includes(q)) hits.push({w, t});
  }));
  resultsBox.innerHTML = hits.slice(0, 8).map(h =>
    "<button data-ref='" + h.w.id + "/" + h.t.id + "'><b>" + h.t.title + "</b>" +
    "<span class='where'>" + h.w.title + " \u00b7 " + h.t.tagline + "</span></button>").join("")
    || "<button disabled><span class='where'>No matching topics</span></button>";
  resultsBox.classList.add("on");
  resultsBox.querySelectorAll("button[data-ref]").forEach(b => b.addEventListener("click", () => {
    exitJourney();
    expandWorld(b.dataset.ref.split("/")[0]);
    openCard(b.dataset.ref);
    closeSearch();
    closeGuide();
  }));
});
searchInput.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    e.stopPropagation();
    closeSearch();
    guideToggle.focus();
  }
});
searchInput.addEventListener("blur", () => setTimeout(() => resultsBox.classList.remove("on"), 150));
</script>
