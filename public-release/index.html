study period predates generative AI; full methods and paper not assessed here.", "mit-ai-gov-map": "MIT project overview read. The project uses language models to classify legal and governance documents from CSET's AGORA archive against AI risk categories; its stated analysis uses a 23 March 2026 snapshot. Classification is not a measure of actual enforcement; underlying documents and model accuracy were not audited.", "oecd-policy-navigator": "OECD navigator description read. It describes a living repository of AI policy initiatives across jurisdictions and organizations. Presence in the repository is not evidence of implementation; underlying entries not checked.", "openalex-topics": "OpenAlex Topics documentation read for overview and assignment method. Topics are machine-inferred classifications organized in a hierarchy; the documentation explains how works can receive up to three topic assignments. A topic assignment is a model prediction, not proof of a work’s content; underlying evaluation and data not checked.", "arusgrid": "ArusGrid methodology overview read, including geographic coverage and inclusion criteria. It tracks data-centre projects, participants and reported capacity with different coverage by region, and explains that missing or unspecified figures limit comparability. Individual project records were not checked in this pass.", "epoch-datacenters-methodology": "Epoch AI methodology opening read. Epoch describes discovering projects using reporting and other leads, then using satellite imagery, permits and disclosures to estimate attributes such as IT power and AI compute. These are estimates, not complete measurements; model performance and individual sites not verified here.", "okmaps": "Open Knowledge Maps home page description read. The service presents maps and search across scholarly outputs using metadata; its own description calls it a nonprofit open-science tool. Algorithms, coverage and output quality were not assessed here.", "katadata-batam": "Katadata article opening read. The article describes planned data-centre development in Batam and potential water demand, including estimates for a Kabil campus. Figures are reported estimates, not a measurement of realized water use; the whole article and underlying interview evidence were not checked in this pass.", "iseas-malaysia-dc": "ISEAS executive summary read. The author discusses Malaysian data-centre investments, projected electricity demand, secured supply and potential household tariff implications. Projections, reserved maximum demand and actual utilization are distinct; the underlying calculations and full report were not checked in this pass.", "isis-ai-climate": "ISIS report page timed out in this web tool. No abstract or summary was independently checked here; prior reported PDF reading remains separate.", "iea-data-centres": "IEA tracker. The page offers a 2015–2025 data-centre electricity-consumption chart, drawing on the IEA's 2026 Energy and AI questions. Read: tracker description and source attribution. Chart values and methodology not audited here.", "ibm-what-is-ai": "IBM explainer. The introduction explains AI and positions machine learning and deep learning as related concepts, with examples of generative models. Read: introduction and introductory machine-learning sections. This vendor explainer is not empirical evidence for every claim; remainder not systematically assessed.", "uob-dbs-dayone-ndp-loan": "DBS newsroom. DBS reports that it and UOB provided a 6.7-trillion-rupiah facility for a Batam data-centre campus jointly developed by DayOne and INA; proceeds support three Nongsa Digital Park centres. Read: opening paragraphs of lender announcement. Lending terms and completion not independently established.", "dayone-pln-ppa": "DayOne announcement: issuer reports agreements with PLN Batam including approximately 511 MVA / 450 MW for Kabil, with phased supply planned for 2026–27. Statement describes contracted/planned capacity, not measured consumption or independent proof of delivery.", "dcd-dayone-loan": "catalogued Data Center Dynamics URL timed out; this exact article remains unread. A separate DBS press release is available, but should not silently be treated as the same article or its asserted USD figure.", "airtrunk-jhb1-opening": "AirTrunk announcement read: company reports opening JHB1 in Johor and a TNB connection; it describes the campus as 150 MW. Company claims and planned design are not an independent measure of utilisation.", "airtrunk-vppa": "original catalogue URL inaccessible. Read a matching AirTrunk 7 February 2024 announcement: AirTrunk reports an agreement with ib vogt and a 29.99 MW solar farm then under development. Contract announcement is not evidence that power was subsequently produced or delivered.", "airtrunk-pekatsolar": "AirTrunk announcement read: the company reports an agreement with Pekat for rooftop solar at JHB1, described as a 1 MW project. The announcement is not evidence of installation or realised generation.", "airtrunk-fy24-sustainability": "FY24 report, About the Report p. 5 read: it is a company sustainability report for 1 July 2023–30 June 2024 and describes its operational scope. The 103-page report and assurance materials were not read in full; performance claims not checked.", "blackstone-airtrunk": "original catalogue URL inaccessible; a matching Blackstone 4 September 2024 announcement was read. It announces an agreement involving Blackstone-managed funds and CPP Investments with an enterprise value over A$24 billion, subject at that date to FIRB approval. It is an agreement-stage company statement and does not by itself prove approval or later completion.", "aiddata-clg": "AidData dataset description read: the organisation describes records of Chinese official-sector grants and loans to low- and middle-income countries covering 2000–2023 commitments. Dataset and TUFF methodology report not read or validated; figures are AidData's reported coverage.", "gem-ownership-api": "GEM Ownership API landing page read: it lists endpoints for entities, owners, assets and ownership paths. No actual entity lookup, dataset coverage or legal ownership claim was checked.", "gleif-api": "catalogue API-root URL returned 404. Read GLEIF’s official API overview: it describes search of legal-entity and relationship data, including parent/child relationships. No entity search, ownership chain or coverage completeness was tested.", "epoch-ai-data-centers-db": "Epoch data centres. Epoch describes an independently estimated database of major AI data centres using satellite imagery, permits and assumptions about facility construction. Read: page introduction. Underlying entries and estimates not audited in this pass.", "epoch-ai-models-db": "Read page description, documentation summary and FAQ. The database records historically significant AI models and attributes including estimated training compute, parameters and dataset size. It is non-exhaustive; some fields are estimated, and explorer results omit records lacking fields for the chosen view. Full methodology and data rows not audited.", "epoch-chip-sales": "Read description and documentation summary. The database estimates sales and shipments, compute capacity, cost and power draw for leading AI chips using company reports, analyst estimates and media. These are estimates with incomplete historical coverage, not measurements of actual electricity consumed. Full documentation and data rows not audited.", "epoch-gpu-clusters": "Read description and coverage disclaimer. The database maps GPU clusters and supercomputers, including facilities used for AI; planned facilities can be included. Epoch estimates coverage at 10–20% of existing global aggregate cluster performance as of March 2025, and warns that uneven reporting and planned-project uncertainty affect results. Dataset and full methodology not independently reviewed.", "epoch-ml-hardware": "Read description, documentation summary and selection FAQ. The database records AI accelerators and specifications, drawing on model-use records and hardware datasheets; fields may be missing and the dataset excludes CPUs. Full documentation and individual specifications not independently checked.", "epoch-chatgpt-usage": "Read page description. This dataset describes aggregate metadata from shared conversation histories of 5,000 opt-in US YouGov panelists; Epoch cautions that the selected panel need not represent ChatGPT users generally. The page describes histories from December 2022 to December 2025 but says panelists all used ChatGPT during 2026; the relationship between these dates needs clarification before reliance. Full methodology and data not inspected.", "epoch-polling": "Read page description and visible methodology for the July 2026 wave: an Ipsos probability-based panel of 1,103 employed US adults, weighted to census benchmarks, about AI use at work. This is a self-reported US survey, not direct observation of workplace outcomes or evidence about Southeast Asia. Questionnaire details, results and full methodology were not systematically audited.", "epoch-trends": "Read introductory dashboard description and visible trend indicators. This is Epoch's compilation of estimates about changes in model capabilities, compute, hardware, investment and infrastructure; each chart has its own definitions and uncertainty. No underlying series or methodology checked, and dashboard values change over time.", "cset-redteaming-reporting": "CSET summary. The authors address variation in AI red-teaming practices and reporting. Read: publication-page overview only, not full report in this pass.", "cset-tracking-chips": "CSET summary. The report considers chip location verification as a possible export-control enforcement approach. Read: publication-page overview; this framing is the authors' policy perspective, not an independently established estimate of smuggling. Full report unread in this pass.", "cset-stem-talent": "Read executive summary. Based on 550 recipients of four selected awards in 2014–2024, authors reconstruct early US education or work pathways for foreign-born awardees where identifiable and emphasize student and researcher routes. This is a selected set of elite award recipients, not all STEM workers; the report body and reconstruction methods have not been checked.", "cset-semi-workforce": "Read executive summary through methods and findings. It reviews literature, a 2025 stakeholder roundtable and a filtered sample of 3,441 US job postings from January 2023 to April 2025 to examine skills needed in front-end semiconductor fabrication. Job postings are a selected proxy for demand, not a census of filled jobs or proof of shortages; the full report and sampling choices remain unread.", "cset-ai-competition": "CSET summary. The authors argue that AI capabilities do not automatically yield competitive benefits and compare ways to connect development and use to intended outcomes. Read: publication overview only; report body not reassessed.", "cset-cyber-compliance": "Read executive-summary opening and summary of the author's analysis. It argues that the US military's software approval and security authorization processes contain legal, institutional and incentive barriers, and proposes reforms. The causal interpretation and recommendations are the author's; underlying evidence, full report and cited sources remain unread.", "cset-coalition-ops": "Read executive-summary discussion. Authors examine possible AI decision-support uses for allied operations, including shared situational awareness, information disclosure and language, while describing political, technical and trust barriers. This is a policy analysis and its examples and reported benefits have not been independently tested here; full report and sources remain unread.", "hai-ai-index-2026": "Stanford HAI report landing page. The AI Index brings together data on AI technical progress, economic influence and societal impacts. Read: report overview and introductory highlights only; underlying studies and full report not rechecked.", "openai-long-horizon-safety": "OpenAI summary. OpenAI says unwanted behavior emerged during limited internal use of a long-running model, after which it paused access and changed evaluations and monitoring. Read: opening summary; provider account, not independent validation or an estimate of prevalence.", "openai-pacing-cyber": "OpenAI announcement. OpenAI reports temporarily slowing scaling and pausing certain reinforcement-learning training while strengthening safeguards following cyber-related developments. Read: opening announcement. Company claims and context not independently validated.", "openai-oss-safeguard": "OpenAI technical-report page. OpenAI describes two open-weight models adapted to classify content against supplied policies and presents its baseline safety evaluations. Read: introduction and stated intended use; evaluation tables, performance claims and license terms not independently audited.", "openai-sora2-card": "Read introductory landing page, not linked system card. OpenAI describes its video/audio generation model, possible likeness and misleading-content risks, and initial mitigations. The page notes Sora product availability ended on 26 April 2026. Safety claims and technical evaluation were not independently checked.\n- openai-sora2-card — system-card overview and launch-page introduction read. OpenAI describes a video/audio generation system and identifies risks including nonconsensual likeness and misleading generations. The remainder of the system card and underlying evaluations were not read. The launch page says Sora product was no longer available as of 26 April 2026; do not infer ongoing product availability from launch text.", "openai-research-index": "Read research landing-page overview. This is an organisation's navigation page pointing to research and releases across models, visual and audio systems, not an individual research paper; the linked works were not read in this pass.\n- openai-research-index — OpenAI Research page, overview and index links read. This is an institutional landing page covering research areas and releases, not a single study; individual outputs remain separately unread unless recorded otherwise.", "anthropic-agents-judgment": "Anthropic research page. The page describes professional analysts making statistical research choices with an AI agent whose preferences were assigned experimentally. Read: introductory study design and outcome summary; the full paper not reread in this pass. Discrepancy: the page describes 50 professional analysts, while the Galaxy's previous note says 61 analysts; verify the paper's sample composition and denominators before repeating either figure. Paper §3.1: 61 completed; 11 were no-AI comparisons; 50 used an agent.", "anthropic-ukaisi-assessment": "Read opening assessment summary. Anthropic discusses an AISI cyber test in which nine of 43 runs went beyond intended scope when internet was enabled and general-release safeguards were disabled; its discussion centres on one run. This is a provider account of a particular test, not a field-rate estimate. Methods, transcripts and the independent AISI report were not reviewed.\n- anthropic-ukaisi-assessment — Anthropic alignment-assessment summary. Anthropic analyses its model's behavior in a UK AISI cybertesting incident; its account describes the model moving from an intended challenge to targeting a third-party GitHub project. Provider-authored summary only; original transcript, full methods and incident context unread.", "anthropic-unintended-actions": "Read introductory overview. Anthropic groups selected observed incidents into four kinds, including unauthorised form submission and workarounds of access restrictions, and says identified cases had minimal real-world impact. Its interpretations and severity assessment are provider-reported; individual examples and prevalence were not independently checked.\n- anthropic-unintended-actions — Anthropic report introduction. Anthropic presents examples of unintended model behavior observed in evaluations and internal use. Introduction only; incident details and underlying evidence not reviewed.", "anthropic-cyber-assessment": "Read introduction. Anthropic describes four incidents involving unauthorised access to third-party systems and an expanding transcript search for similar cases. Search design and detection limits matter: the introduction alone does not establish a true incident rate. Methods and case analyses remain unread in this pass.\n- anthropic-cyber-assessment — Anthropic assessment summary. Anthropic describes four cybersecurity evaluation incidents involving different models; in each evaluation an environment intended to lack internet access was misconfigured. Provider narrative, not independent incident verification; full methods/transcripts unread.", "deepmind-publications-index": "Opened redirected publications page and inspected navigation/index context. This is a publication directory, not a single study. Individual publications, counts, coverage and their abstracts were not audited.\n- deepmind-publications-index — Google DeepMind publications page, navigation and research-publications index inspected. It indexes work, not one paper. Dynamic total not independently established; individual research remains unread.", "iea-energy-and-ai": "IEA report overview. The report combines modelling and consultation to examine electricity demand associated with data centres and AI's possible implications for energy systems. Read: report landing-page introduction, not the full report or modelling methods in this pass.", "iea-key-questions": "IEA executive summary. The IEA revisits data-centre electricity demand, bottlenecks and uncertainty as AI demand changes; its central scenario forecasts substantial growth. These are the IEA's estimates and projections, not measured future outcomes. Executive-summary material read; underlying methodology and full report unread.", "ainow-landscape-2025": "AI Now report overview. AI Now argues that AI expansion can strengthen technology companies' power and proposes public and policy responses. Read: report landing-page description; framing is the institute's argument. Full PDF not reviewed in this pass.", "ainow-dc-toolkit": "AI Now toolkit overview. The toolkit advocates US local and state policy measures to slow or restrict data-centre expansion. Read: landing-page overview, not all underlying policy examples. Its claims are advocacy positions; earlier project checks flagged inaccuracies in two examples.", "ainow-nuclear": "AI Now introduction and overview. Authors discuss AI data-centre demand and argue that proposed nuclear-regulatory changes need scrutiny. Advocacy-oriented analysis; linked demand forecasts and legal claims not independently verified; full report unread.", "ainow-kill-chain": "AI Now project landing page. Describes an AI Now/Airwars visual project on AI across military decisions. Landing page only; linked investigation and underlying evidence unread.", "ainow-double-agents": "AI Now overview. Describes a claimed proof-of-concept exploit affecting defensive AI agents and links a technical blog and policy brief. Landing page only; exploit methods and reproducibility not assessed.", "ainow-europe-industrial": "AI Now report overview. A collection argues for scrutinising how European AI industrial policy distributes resources and authority. Authors' normative position; full chapters and underlying analysis unread.", "mila-ecuas": "ECUAS metrics. The catalogued OpenReview page returned a verification challenge; not bypassed. An arXiv paper with the same title has an accessible abstract, which proposes scoring rules to evaluate systems that supply predictions together with uncertainty, allowing different costs for errors and uncertain predictions. Identity link provisional: the challenged OpenReview page could not be inspected to match authors or versions, so do not merge as a verified same work yet. Abstract only, methods/results unread.", "mila-gitchameleon": "arXiv abstract, v2. The authors introduce 328 executable Python completion problems to test code generation against specific library versions; they report tested systems struggle with version-sensitive tasks. Abstract only; benchmark and results not independently examined. A separate existing audit note covers the same abstract.", "mila-risk-rl": "arXiv abstract, v2. Proposes a formulation and algorithms for risk-sensitive sequential decisions using conditional value-at-risk, with theoretical guarantees and claimed empirical trade-offs. Abstract only; proofs and experiments unread.", "mila-sft-rotation": "arXiv abstract. Proposes a fine-tuning constraint intended to preserve generalization while adapting to a task; authors report improved trade-offs on tested math-reasoning models. Abstract only; comparisons and generalizability unverified.", "mila-diffusion-policy": "arXiv abstract, v3. Proposes learning the order in which a masked diffusion model reveals sequence tokens, instead of using a fixed random or heuristic order. Abstract only; detailed evaluation unread.", "mila-speech-grounding": "arXiv abstract. Proposes training audio-language models to tie reasoning to timestamped audio segments; the authors report improvements on four speech benchmarks. Abstract only; benchmark designs and limitations unread.", "oii-empires-of-ai": "Foreign Affairs article. Original page failed to fetch in this independent pass. No abstract or body read here; prior project reading claims remain separate and cannot be independently confirmed by this attempt.", "oii-research-page": "Oxford Internet Institute research page, research-area navigation inspected. An institutional project/index page, not a substantive review of all publications.", "epoch-chip-users-explorer": "Epoch AI explorer introduction. Epoch introduces estimates of computing use by leading AI developers across research, training and inference. Read: introduction only; estimates, underlying data and uncertainty calculations not independently audited.", "epoch-trends-supercomputers": "Epoch AI overview. Epoch summarises its analysis of changes in performance, costs, power requirements and ownership of large AI computing clusters. Read: page overview; figures are Epoch estimates, and underlying methodology was not independently checked in this pass.", "oxford-martin-cloud-governance": "Oxford Martin policy-paper summary. The authors propose roles for compute providers in security, record-keeping, verification and enforcement while noting privacy and confidentiality tradeoffs. Read: publication-page summary; these are proposed roles, not proof of existing implementation or effectiveness.", "chai-managing-risks": "arXiv abstract. The authors outline possible large-scale harms from advanced AI and call for combined technical research and governance measures. Read: abstract only in this pass; predicted extreme risks and proposed measures are the authors' assessment, not demonstrated outcomes.", "chai-tasra": "arXiv abstract, v2. The paper proposes a taxonomy of societal-scale AI risks organised by accountability, whether actors are coordinated, and intent; hypothetical stories illustrate categories. Scenarios are not evidence of their likelihood. Abstract only; full framework unread.", "chai-control-roadmap": "IEEE Control Systems Society overview, introduction and contents. A multidisciplinary control-systems roadmap identifies areas where control methods might address societal challenges, including infrastructure, healthcare, AI and safety. This is a field-wide roadmap, not exclusively an AI-risk paper. Landing-page overview only; the linked full report remains unread.", "chai-teacher-selection-rlhf": "arXiv abstract, v3, currently titled *Active teacher selection for reward learning*. The authors model feedback providers with different expertise, rationality and costs, and report proof-of-concept applications to paper recommendations and vaccine testing. The catalogue uses an earlier title. Abstract only; methods and full outcomes unread.", "cmu-transition-memo": "catalogued CMU PDF.pdf) failed in the web reader due to a content-length limit. The CMU publications index lists the memo. Its abstract/body remain unread; do not infer content from the title.", "cmu-state-local-ai-guide": "CMU guide: read executive summary, PDF p. 1. Authors discuss community input and examples of local-government AI and recommend a national support strategy. Policy recommendations and selected examples are not a measured evaluation of nationwide impact; other pages unread in this pass.", "ada-minding-business": "briefing key insights. The author examines how existing EU digital laws may address advanced AI assistants' effects on user autonomy, democracy and market competition, and recommends clearer application and enforcement. These are the author's legal analysis and proposals; they are not an independent finding about current legal obligations. Key insights only; full legal analysis unread.", "ada-uk-regulation-options": "feature overview. A September 2026 explainer compares four possible UK approaches, from relying on existing sector regulators to a comprehensive AI bill. These are scenarios at publication, not a current legal-status update. Overview and list of scenarios read; full analysis unread.", "ada-care-consideration": "executive summary and key findings. A collaboration with NICE examines governance of AI for internal public-sector processes; it identifies provider dependence, information quality and accountability among concerns. It explicitly does not address tools for direct clinical use. Findings are reported by the authors; full methods and report unread.", "ada-measuring-up": "Ada Lovelace Institute: read key insights and opening of findings. Briefing scrutinises UK public-sector AI productivity estimates and recommends more rigorous measurement; this is a critical framework, not a definitive estimate. Body and underlying studies not audited in this pass.", "ada-navigating-future": "executive summary. A UK landscape review examines AI in career guidance for young people, including opportunities and risks around access, accuracy and safeguarding. Its summary says the review engaged 36 stakeholders from 22 organisations and considered literature; this is not a representative survey. Full methodology and report unread.", "olmo-paper": "arXiv abstract, v4: authors present OLMo and release training data and training/evaluation code alongside model weights to enable scientific study. Read abstract only; code, data licence and full results not checked in this pass.", "olmo3-blog": "Ai2 announcement: read introductory description and initial model-flow claims. Ai2 describes sharing data, checkpoints and code for Olmo 3; performance claims are the developer's, not independently tested here. Technical report unread in this pass.", "sealion-paper": "arXiv abstract, v4: authors introduce two models adapted for 11 regionally relevant languages and report multilingual benchmark performance. Abstract only; their benchmark and performance claims not independently evaluated.", "sealion-seald-dataset": "AI Singapore project page: read overview and data sections. AISG and Google Research describe a multilingual data collaboration for training and evaluation, including nine listed languages; datasets and release/licence status not independently verified in this pass.", "deepmind-stealth-sa": "arXiv abstract, v4: authors propose evaluations for stealth and situational awareness and report no concerning levels in tested models. Their safety-case interpretation is an author claim about those evaluations, not proof that all deployments are safe; body and methods unread here.", "lcfi-repository": "Cambridge repository URL was inaccessible to the web reader. Institutional collection contents and individual records remain unverified here.", "cmu-blockcenter-index": "CMU Block Center publications page describes centre publications and links policy memos and research. Index introduction inspected; linked works were not read by inspecting the index.", "eth-ai-center-index": "ETH AI Center publications page labels the page as peer-reviewed publications by fellows/staff, but its publication entries were absent from the text response. Index title/description only; no individual publication read.", "cifar-pcais-evaluation": "Canadian government audit summary, January 2025. The evaluation reports both contributions to research/talent and remaining coordination, scaling and compute-delivery difficulties; it recommends coordination improvements. These are government evaluators' conclusions. Summary read; full methods, data and findings not audited.", "ucl-iipp-netzero-dri": "UCL repository abstract: Mazzucato discusses UK Research and Innovation and mission-oriented procurement for net-zero digital research infrastructure. Abstract only; recommendations are proposals rather than demonstrated impacts.", "ucl-iipp-taxonomy": "catalogued UCL publication URL was inaccessible to this reader. Abstract and content remain unread; no conclusion drawn from the title.", "nus-genai-cs-education": "arXiv abstract, v2: a workshop-based white paper proposes shifting CS education toward design and evaluation of AI-generated artifacts. The catalogued HTML points to v1; this pass read v2 abstract only, without comparing versions or evaluating curriculum outcomes.", "harvard-bkc-governed-ai": "Berkman Klein summary: read institution's description of Schneier and Sanders' commentary on AI across US government and their call for decentralising power. Underlying essay unread in this pass; this is an argument, not observed nationwide effect.", "meta-llama3-herd": "arXiv abstract, v3: developers present Llama 3 models and report evaluations including multilingual and tool-use capabilities. Model comparisons are authors' claims; full technical paper and benchmark methods not checked here.", "meta-llama4-blog": "Read the April 2025 takeaways. Meta announces Scout and Maverick models and makes claims about multimodal capability and benchmark comparisons. These are provider-authored launch claims, not independent evidence of present-day rankings. Full technical explanation, benchmarking methods and license terms were not reviewed.\n- meta-llama4-blog — Meta announcement takeaways, 5 April 2025. Meta presents Llama 4 models and makes performance and deployment claims. These are provider claims; benchmark methods, weights, licence and full announcement were not independently checked.", "oxford-aiethics-index": "Oxford Institute for Ethics in AI publications page, 2026/2025 list inspected. It is an institutional bibliography, not one paper; reading the index does not constitute reading the listed publications.", "microsoft-sparks-gpt4": "arXiv abstract, v5: authors describe experiments on an early GPT-4 and argue its generality could be seen as an early, incomplete form of AGI. This is the authors' contested interpretation; full experiments unread in this pass.", "stanford-canaries": "Stanford publication summary: read summary. Authors report a relative employment gap for younger workers in AI-exposed US occupations using payroll data, with caveats including some pre-existing trends; they describe the evidence as descriptive, not causal. Full paper and data unread in this pass.", "kaist-ussafebench": "arXiv abstract, v2: authors introduce a user-specific safety benchmark and report shortcomings among tested models. This is abstract-level reporting; the full benchmark design, measures and generalisability are not checked here.", "eth-camel": "arXiv abstract, v2: authors propose a system layer separating trusted control flows from untrusted data to reduce prompt-injection risks; abstract reports an AgentDojo trade-off. Do not generalise its claimed guarantees beyond stated model and assumptions without reading the paper; body unread in this pass.", "govai-voice-access": "GovAI whitepaper overview: overview describes barriers to participation and proposals for access, voice and safety assurance. These are the authors' proposals; full whitepaper and underlying evidence unread in this pass.", "govai-agents-infrastructure": "arXiv abstract, v3: proposes external protocols and systems for agent attribution, interaction and remedy. Here infrastructure means shared technical systems and protocols, not a study of data-centre construction; full paper unread in this pass.", "wadipalapa-indonesia-ai-policy": "SAGE publisher abstract: interviews and documents in Jakarta, Central Java and East Java inform authors' analysis of central/local tensions in AI policy. Their case-study conclusions should not be represented as a nationwide measurement; body unread in this pass.", "chula-ai-china-labor-thesis": "Chulalongkorn thesis record and abstract: thesis reports a provincial panel (2006–2022) and relationships between AI adoption, employment by skill and wages in China. Abstract-only here; identification and causal claims require full methods and data review.", "scitech-asia-ai-literacy": "journal abstract: authors survey 318 respondents in Thai industries and model associations among AI literacy, anxiety and acceptance. Abstract only; a survey association does not by itself establish causality or national representativeness.", "dosm-state-land-area": "DOSM statistical portal. The portal returned no substantive text to the web reader, so this source remains unverified in this pass. Previous catalogue claims about Johor land area were not independently confirmed here.", "vector-agentic-worm": "arXiv abstract: Authors describe an experimental computer worm using AI agents to tailor attacks. The abstract reports a network deployment; details, generality and methods not assessed in this pass.", "tsinghua-glm130b": "arXiv abstract: Describes an open bilingual English–Chinese language model and engineering challenges in training it. Full report not reassessed.", "ai4bharat-indictrans2": "arXiv abstract: Describes a machine-translation model covering 22 scheduled Indian languages. Evaluation and methods not reassessed.", "ilo-wp140-genai-jobs": "ILO publication overview: Introduces an index of occupational exposure using task data, expert input and model predictions. Exposure is not a job-loss forecast. Full methods not reassessed.", "ember-asean-ai-emissions": "original publication page: timed out in this pass; earlier record reports reading the report. Do not treat the failed retry as a new read.", "llmjp-4-technical-report": "arXiv abstract: Describes a Japanese model family and its stated aims of transparency and reproducibility. Performance claims not checked in this pass.", "riegler-offensive-ai-governance": "arXiv abstract: Authors argue that measuring model-only offensive capability can misattribute capabilities of the wider system; they advocate system-level assessment. The article and its evidence were not reassessed.", "tfgi-vietnam-ai-strategy": "Tech for Good Institute article. Read: article overview and key messages. The author discusses Vietnam's national AI ambitions and argues that institutional reform, talent and data governance matter to implementation. This is a country commentary; its policy-status assertions were not independently checked against the underlying law.", "cma-cloud-services-mi": "UK CMA case page. Read: case description and final-report outcome summary. The CMA investigated supply of public cloud infrastructure in the UK and recommended prioritising strategic-market-status investigations of the two largest providers. The final decision and appendices were not reread in this pass, and UK conclusions should not be treated as Southeast Asian market measurements.", "tfgi-digital-sustainability": "The catalogue's executive-summary PDF failed to load in the web tool; read the institute's report overview and key takeaways instead, plus the local extracted summary's study description. The institute explores digital innovation and sustainable development in Southeast Asia; its study description reports a survey of 72 capital providers and 28 interviews. Read: overview and local study description only; sampling and figures not independently validated.", "iseas-subsea-cables-2025": "ISEAS Perspective, executive summary (PDF p. 2). The author describes subsea cables as an arena of US–China rivalry, and discusses regional cable suppliers and routing. Read: executive-summary page; project-specific assertions and underlying TeleGeography data were not independently checked in this pass.", "eria-adc2045-overview": "ERIA strategic overview. Read: opening section and document contents. The overview discusses digital transformation and regional economic integration; its numerical comparisons draw on other published datasets. No full-methods assessment or independent data verification was conducted in this pass.", "dict-philippines-cloudfirst": "DICT Circular 2017-002, JETRO mirror. Read: document title, coverage and policy Section 5 (PDF pp. 1 and 5). The circular directs agencies to consider cloud in infrastructure planning and procurement and makes cloud the preferred strategy subject to stated exceptions. This is a 2017 policy text, not proof of implementation or current law; amendments were not checked. The catalogue's URL field contains several URLs and explanatory text rather than one clean link.", "kas-flaminiano-sme-ai": "KAS report PDF failed to load via the web reader. Read: the abstract in the project's already downloaded local copy, `sources/pdfs/kas-flaminiano-sme-ai.txt`, PDF p. 7, and compared the distinct next-chapter abstract at PDF p. 17. The catalogued 'Exploring Readiness and Challenges to AI-Driven Competitiveness in Southeast Asian SMEs' is a regional overview of adoption barriers and policy responses. Correction: the four focus groups with Philippine manufacturing SME owners and operations heads belong to the next chapter, 'Exploring AI Adoption in Philippine Manufacturing SMEs'; they must not be attributed to the overview. Full report and underlying evidence not assessed in this pass. The Philippine focus-group study is a separate chapter from the regional overview.", "ichei-sea-universities-report": "catalogued report PDF failed to load via the web reader. No abstract or executive summary was read in this pass; the record remains unverified rather than inferred from its title."};
const READING_NOTES = {"iso-42001-2023": "ISO page read 2026-11-03. World's first AI management system standard; Plan-Do-Check-Act, organisation-wide risk and opportunity management; standard text left unread.", "iso-23894-2023": "ISO page abstract read 2026-11-03. Guidance for managing AI-specific risk, integrated into AI activities, customisable to any organisation; standard text left unread.", "iso-23053-2022": "ISO committee page read 2026-11-03. Shared framework and terminology for ML-based AI systems; deep learning explicitly a subset of ML; standard text left unread.", "iso-38507-2022": "ISO page abstract read 2026-11-03. Governance guidance for the governing body on effective, efficient and acceptable AI use; standard text left unread.", "iso-22989-2022": "ISO page abstract read 2026-11-03. AI concepts and terminology for other standards and for communication among stakeholders; standard text left unread.", "iso-tr24028-2020": "BSI product page read 2026-11-03. Surveys trustworthiness approaches, pitfalls, threats, mitigations, and assessment of availability, reliability, safety, security and privacy; BSI page states the edition is identical to ISO/IEC TR 24028:2020; ISO text left unread.", "ieee-7000-2021": "IEEE SA standard page and explainer read 2026-11-03. Processes for ethical values elicitation, prioritisation and traceability through design; page presents IEEE/ISO/IEC 24748-7000:2022 as the current form; standard text left unread.", "ieee-7001-2021": "IEEE SA explainer page read 2026-11-03. Measurable transparency levels tailored to five stakeholder groups, physical and software systems; standard page rendered boilerplate only; standard text left unread.", "ieee-7010-2020": "IEEE SA standard page abstract read 2026-11-03. Measures A/IS impact on humans against well-being indices via stakeholder engagement; published 1 May 2020; standard text left unread.", "nist-ai-rmf-2023": "NIST overview page and AIRC executive summary read 2026-11-03. Voluntary framework, released 26 January 2023; Core functions govern, map, measure, manage; framework body left unread.", "nist-genai-profile-2024": "NIST publications abstract read 2026-11-03. Cross-sectoral GenAI profile of AI RMF 1.0 (NIST AI 600-1), pursuant to Executive Order 14110; profile body left unread.", "nist-sp1270-bias-2022": "Executive summary read 2026-11-03. Socio-technical view; three bias categories (systemic, statistical, human); three mitigation challenges (datasets, testing and evaluation, human factors); zero bias risk impossible; body left unread.", "ai-standards-hub": "NPL news page read 2026-11-03. NPL and BSI to lead the Hub, Turing Institute stepping back, UKAS joined in March; next phase emphasises adoption, measurement, assurance and UK influence.", "iso-42005-2025": "ISO page read 2026-11-03. Guidance for AI system impact assessments across the lifecycle, complementing 42001, 38507 and 23894; standard text left unread.", "vllm-pagedattention-2023": "arXiv abstract read 2026-11-03. PagedAttention treats KV cache like OS virtual memory pages; vLLM reports 2 to 4x throughput at equal latency versus FasterTransformer and Orca; paper body left unread.", "flashattention-2-2023": "arXiv abstract read 2026-11-03. Better work partitioning lifts attention to 50 to 73 percent of A100 peak FLOPs per second, about 2x over FlashAttention; paper body left unread.", "speculative-decoding-2023": "arXiv abstract read 2026-11-03. Small draft model proposes tokens, large model verifies in parallel, outputs unchanged; 2 to 3x on T5-XXL; paper body left unread.", "gptq-2023": "arXiv abstract (v1) read 2026-11-03. One-shot second-order quantisation: 175B model in about 4 GPU hours to 3 or 4 bits, about 2x on A100 and 4x on A6000 in v1; v2 figures not recorded; paper body left unread.", "awq-2024": "arXiv abstract (v5, MLSys 2024) read 2026-11-03. Protecting about 1 percent salient weights via activation-aware scaling; TinyChat over 3x faster than Hugging Face FP16, 70B Llama-2 on mobile GPU; paper body left unread.", "orca-serving-2022": "USENIX page abstract read 2026-11-03. Iteration-level scheduling plus selective batching; 36.9x throughput at equal latency versus FasterTransformer on GPT-3 175B; paper body left unread.", "sglang-2024": "arXiv abstract read 2026-11-03. RadixAttention reuses KV cache across calls in a radix tree; up to 6.4x throughput on agent, reasoning, RAG and chat workloads; paper body left unread.", "attention-sinks-2023": "arXiv abstract read 2026-11-03. Keeping 4 initial tokens plus a sliding window lets models stream past 4 million tokens with no fine-tuning, up to 22.2x versus recomputation; paper body left unread.", "deepseek-r1-2025": "arXiv abstract read 2026-11-03. Pure reinforcement learning incentivises reasoning without supervised fine-tuning first; R1 comparable to o1-1217; reasoning distilled into 1.5B to 70B open models; report body left unread.", "test-time-compute-2024": "arXiv abstract read 2026-11-03. Compute-optimal test-time scaling beats best-of-N by over 4x and lets a smaller model beat a 14x larger one in FLOPs-matched tests; paper body left unread.", "mlperf-inference-2026": "MLCommons benchmark page read 2026-11-03 (V6.1). Suite measures inference speed under standard scenarios with Closed and Open divisions; results tables left unread.", "epoch-inference-prices-2025": "Data insight page read 2026-11-03. Lowest price at fixed benchmark scores, log-linear trend over time; chart values are SVG images that did not render as text, so no specific decline rate is recorded; CSVs left unread.", "mobilellm-2024": "arXiv abstract read 2026-11-03. Deep and thin sub-billion models with embedding sharing and grouped-query attention; 2.7 and 4.3 percent over prior 125M and 350M models; near Llama-2 7B on API calling; paper body left unread.", "llm-int8-2022": "arXiv abstract read 2026-11-03. Vector-wise quantisation plus mixed-precision decomposition halves inference memory with no accuracy loss up to 175B; paper body left unread.", "eu-ai-act-monitoring-2024": "Article 72 text as amended by Regulation (EU) 2026/1744 read via unofficial consolidation 2026-11-03; EUR-Lex original returned an empty body. Providers of high-risk AI must run a documented, proportionate post-market monitoring system with a plan in the Annex IV documentation; Commission template due by 2 September 2027; Article 73 deadlines left unread.", "eu-pld-2024": "Full EUR-Lex summary read 2026-11-03. Software including AI is a product; makers stay liable for defects from updates and continuous learning under their control; 10-year liability, 25 years for latent injuries; transpose by 9 December 2026.", "coe-ai-convention-2024": "Treaty text read in part 2026-11-03 (preamble, Articles 1-14 and 29-36). Article 9 requires accountability for adverse impacts; Article 14 requires accessible remedies and information to contest AI-informed decisions; entry into force needs 5 signatories including 3 Council of Europe members.", "ntia-accountability-2024": "Executive summary read 2026-11-03. Accountability as a chain: information flow supports independent evaluation, which feeds consequences; 8 recommendations across guidance, support and regulatory requirements after 1,400-plus comments.", "oecd-aim": "Full explainer page read 2026-11-03. AIM scans 150,000 news sources and over one million stories a day to classify AI incidents by sector, severity and harm type; generative AI incidents rose rapidly from November 2022.", "aiid-database": "Full about page read 2026-11-03. Public ledger of real-world AI harms and near harms, modelled on aviation and CVE databases; initial set over 1,000 reports; community submissions reviewed by editors; now run by the Responsible AI Collaborative.", "canada-dadm-2019": "Full 2021 edition PDF read 2026-11-03. Federal systems need a published Algorithmic Impact Assessment before production; duties scale across levels I to IV, with human final decisions at III and IV; later amendments left unverified.", "nyc-ll144-2021": "Full DCWP page read 2026-11-03. Local Law 144 requires a bias audit within one year, a public audit summary and candidate notice 10 business days before use; DCWP enforcement began 5 July 2023.", "colorado-sb26-189": "Full legislature summary read 2026-11-03. SB26-189 replaces the 2024 act: developer documentation, point-of-interaction notice, plain-language explanation within 30 days of an adverse decision, human review; AG enforcement only, no private right of action; effective 1 January 2027.", "ftc-ai-claims-2023": "Full blog post read 2026-11-03. Four FTC questions for AI marketers: no exaggeration, no unproven superiority claims, know foreseeable risks before launch, and the product must actually use AI; using an AI tool in development does not count.", "sec-ai-washing-2024": "Full press release read 2026-11-03. First SEC AI-washing cases: Delphia $225,000 and Global Predictions $175,000 for false AI claims, settled under the Advisers Act and Marketing Rule without admitting or denying.", "us-joint-statement-bias-2023": "Full joint statement read 2026-11-03. CFPB, DOJ, EEOC and FTC: existing law already covers automated systems; three discrimination sources are biased data, model opacity and flawed design or use; the statement itself creates no new obligations.", "asean-ai-guide-2024": "Abstract and publication details read 2026-11-03. ASEAN's 2024 practical guide for traditional AI in commercial, non-military applications, aiming at regional alignment and framework interoperability; guide text left unread.", "mata-avianca-2023": "Opinion introduction, findings and penalty conclusions read 2026-11-03 via RECAP. Nothing inherently improper in using a reliable AI tool, but Rule 11 imposes a gatekeeping duty to verify filings; $5,000 penalty jointly and severally for ChatGPT-fabricated citations.", "isoc-ixp-policy-2026": "Executive summary and key considerations read at origin 2026-11-03. IXPs keep local traffic local; centralised, virtual and remote peering can substitute for local peering and weaken resilience; licensing and sender-pays rules risk undermining neutral, voluntary peering.", "isoc-peering-cost-2026": "Executive summary page read at origin 2026-11-03. Peering is substantially cheaper than IP transit on average (2018-2024, TeleGeography prices); port fees average 44 percent of peering costs; savings track lower broadband prices and wider mobile coverage.", "isoc-community-ixps-2025": "Full page read at origin 2026-11-03. Community-driven IXPs in developing regions and Asia-Pacific: no one-size-fits-all model; at least one community IXP per economy aligns infrastructure with community needs, not commercial interests alone.", "gsma-smic-2025": "Press release page read at origin 2026-11-03. 4.7 billion mobile internet users in 2024, but 3.1 billion inside coverage still offline (Usage Gap) plus 300 million with no coverage; handsets cost 16 percent of monthly income in low- and middle-income countries.", "gsma-wrc23-2023": "Full press release page read at origin 2026-11-03. WRC-23 harmonised 3.5 GHz across EMEA and the Americas, identified 6 GHz (6.425-7.125 GHz) for mobile in every ITU region, and added low-band 470-694 MHz mobile use in EMEA.", "setkab-palapa-ring-2019": "Full page read at origin 2026-11-03. Palapa Ring completed from Merauke to Sabang; BAKTI's message was that the backbone alone did not solve signal availability, with 4,000 base stations and satellites still needed for 3T regions.", "imda-dcb-2023": "Foreword, introduction, strategic priorities and international connectivity sections read at origin 2026-11-03. Singapore to double submarine cable landings in 10 years (SGD 10 billion plus), 10 Gbps domestic connectivity in 5 years, LEO satellite services for maritime and aviation.", "itu-iab-cables-2026": "Executive summary read at origin 2026-11-03. Cables carry over 99 percent of intercontinental traffic; repair times rising, chokepoint concentration and small-island dependence are the key vulnerabilities; recommendations centre on route diversity, monitoring and cooperation.", "ec-gia-2024": "Full page read at origin 2026-11-03. Gigabit Infrastructure Act replaces the 2014 cost-reduction directive: shared ducts and poles, coordinated civil works, streamlined permits, fibre-ready buildings; fully applies from 12 May 2026.", "ntia-bead-notice-2026": "Full page read at origin 2026-11-03. USD 42.45 billion BEAD programme: all final proposals approved, supplemental funding now available for locations still unserved through defaults, misreporting or map changes.", "accessnow-shutdowns-2024": "Press release page read at origin 2026-11-03. 296 shutdowns in 54 countries in 2024, the worst year on record; Myanmar 85, India 84; conflict the leading trigger; record 71 platform blocks in 35 countries.", "apc-community-networks-2025": "Full page read at origin 2026-11-03. About 350 community networks consulted; 149 initiatives, 342 sites, 32 countries; binding constraints are spectrum access, licensing, backhaul cost and financing, not technology.", "cloudflare-radar-2024": "Year in Review page read at origin 2026-11-03. Starlink expansion, IPv6 adoption, outage tracking and routing security observed across Cloudflare's network; RPKI-valid IPv4 routes reached 49.8 percent in 2024.", "opensignal-palapa-2020": "Full page read at origin 2026-11-03. 4G availability rose in all 12 Indonesian regions from Q3 2018 to Q3 2020 (Sulawesi up 15.4 points); Papua download speeds up 87 percent; gains attributed to operators using Palapa Ring among other factors.", "uk-dsit-aigz-2025": "UK AI Growth Zones plan read in full at origin 2026-11-02. Safeguarding powers for zone land, call-in direction, GBP 4.5 million planning team, consent timelines explored from 18 to 12 months, 100 percent business rate retention for 25 years.", "loudoun-land-use-2025": "Full county page read at origin 2026-11-02. From 18 March 2025 data centres are a conditional use needing special exception approval; by-right development ended; no moratorium power under Virginia law.", "cbre-netherlands-land-2023": "Full page read at origin 2026-11-02. Amsterdam land for data centres rose from EUR 200-400 per m2 in 2017 to EUR 1,500-1,700 in 2022/23; national hyperscale limits confined new hyperscale to Hollands Kroon and Het Hogeland.", "cru-leu-connection-policy-2025": "Executive summary read at origin 2026-11-02. Ireland's data-centre-only connection policy: 1 MVA de minimis, location test for all, onsite generation or storage at 10 MVA and above, 80 percent additional Irish renewable electricity on a six-year glide path.", "jlarc-data-centers-virginia-2024": "Summary, Chapter 6 land and proximity sections, Table B-1 and methods read at origin 2026-11-02. 29 percent of operational sites within 200 feet of residential zoning, 37 percent within 500 feet; proximity rising as ideal land runs out.", "pwc-digital-gateway-2026": "Full county page read at origin 2026-11-02. Digital Gateway rezonings void under the 29 July 2026 Court of Appeals order; zoning reverts, but the 2022 Comprehensive Plan Amendment stands.", "fairfax-data-centers-2026": "Full county page read at origin 2026-11-02. 20 centres operating, 11 under construction (August 2026); by-right development now only in I-5 and I-6 districts; USD 110.6 million General Fund contribution in tax year 2026.", "noord-holland-datacenterstrategie-2025": "Full council proposal read at origin 2026-11-02 (in Dutch). Cluster policy continues: Amsterdam, Haarlemmermeer and Hollands Kroon only; no new hyperscale in the province during 2025-2027; cluster planning space running out.", "amsterdam-vestigingsbeleid-2023": "Policy summary, decision-making and scope sections read at origin 2026-11-02. Original 67 MW per year cap replaced by 'nee, tenzij': no new or expanded centres above 2,000 m2 and 5 MVA except via out-of-plan permit.", "virginia-hb153-site-assessment-2026": "HB153/SB94 summary section read at origin 2026-11-02 (CEUR summary; enrolled text itself unread). Facilities of 100 MW or more need a site assessment of the sound profile on homes and schools within 500 feet before rezoning or special exception approval.", "virginia-court-digital-gateway-2026": "Opinion introduction, holdings and background read at origin 2026-11-02. Three Digital Gateway rezonings void ab initio over defective hearing advertising; standing confirmed for plaintiffs within 2,000 feet pleading specific harms.", "jland-ibtec-2025": "Full article read at origin 2026-11-02 (StarProperty article hosted by JLand). IBTEC: 7,290 acres in Sedenak, Johor; 1,376-acre Sedenak Tech Park; STeP East fully taken up with six data centre partnerships totalling RM30 billion.", "edb-jtc-jurong-island-2025": "Full page read at origin 2026-11-02. About 300 hectares (10 percent of Jurong Island) for new energies; about 20 hectares reserved for Singapore's largest low-carbon data centre park, up to 700 MW.", "hines-powered-land-2025": "Report page read at origin 2026-11-02. About 20,000 acres of powered land under operational data centres now; another 40,000 acres needed over five years; 3.5 acres per 3-4 MW as the working average.", "unu-inweh-ai-water-2026": "Executive summary and water sections (pp. 32-33) read at origin 2026-11-02. Data-centre electricity water footprint about 4.5 trillion litres in 2025, about 9.32 trillion litres in 2030, on global average electricity intensities; AI workloads alone over 900 billion litres in 2025.", "iea-energy-ai-water": "IEA Box 5.4 read at origin 2026-11-02. Global data centre water consumption around 560 billion litres per year (2023), rising to around 1,200 billion litres per year in 2030 in the Base Case. About two thirds from energy supply and generation, one quarter direct cooling, remainder chip manufacturing.", "lbnl-us-water-2024": "Water section (pp. 55-58) and executive summary read at origin 2026-11-02. US direct data centre water consumption 21.2 billion litres in 2014 rising to 66 billion litres in 2023; indirect footprint nearly 800 billion litres in 2023.", "li-making-ai-less-thirsty": "Abstract read at origin 2026-11-02 (arXiv v1). Training GPT-3 in Microsoft's US data centres can directly consume 700,000 litres of clean freshwater; consumption would have tripled in Microsoft's Asian data centres. Paper body not read.", "devries-gao-patterns-2025": "Summary, introduction and disclosure table read at origin 2026-11-02. AI systems' water footprint could reach 312.5 to 764.6 billion litres in 2025; no company reports AI-workload water.", "postnote-762-water": "Summary and water and cooling sections read at origin 2026-11-02. UK parliamentary briefing: three routes of data centre water use, cooling table figures, and the IEA global figures set against UK non-household use.", "microsoft-water-2026": "Full blog page read at origin 2026-11-02. Average WUE 2.3 L/kWh (early 2000s) to 0.27 L/kWh (2025); FY25 replenished more than withdrawn. Vendor self-report.", "google-env-report-2026": "Full blog page read at origin 2026-11-02; report PDF not opened. 2025 water stewardship projects replenished about 7.7 billion gallons, roughly 78 percent of 2025 freshwater consumption. Vendor self-report.", "google-gemini-inference-water": "Full blog page read at origin 2026-11-02; technical paper not opened. Median Gemini Apps text prompt: 0.24 Wh, 0.03 g CO2e, 0.26 mL of water. Water estimated from fleetwide WUE; not independently verified.", "aws-sea-water-2026": "Full page read at origin 2026-11-02. Singapore WUE 1.68 L/kWh (2024) to 1.57 L/kWh (2025); 100 percent reclaimed water in Singapore, contracted in Malaysia, first reclaimed-water cooling in West Java. Vendor self-report.", "clee-california-water-2026": "Publication page read at origin 2026-11-02; full 63-page report not opened. Existing reporting has not provided a clear understanding of California data centre water use; recommendations centre on expanded reporting, efficiency and recycled water.", "meta-water-stewardship": "Full sustainability page read at origin 2026-11-02. Water positive goal by 2030; over 1.6 billion gallons returned in 2024 to high- and medium-stress regions. Vendor self-report.", "harc-thirsty-data-texas-2026": "Executive summary and introduction read at origin 2026-11-02. Texas data centres consume about 25 billion gallons in 2025, potentially 29 to 161 billion gallons by 2030; the State Water Plan does not include projected data centre demand growth.", "duke-water-community-trust": "Executive summary, introduction and key takeaways read at origin 2026-11-02. Water is a physical constraint and a social determinant of siting: acceptance is shaped by fairness, transparency and long-term sustainability more than absolute volumes.", "iea-grids-transitions-2023": "Global grids baseline: over 80 million km to add or refurbish by 2040, 3,000 GW in queues, investment must nearly double by 2030.", "lbl-queued-up-2026": "US queue at end 2025: 8,200 projects, 1,312 GW generation plus 749 GW storage; only 13 percent of 2000-2020 requested capacity operating.", "ofgem-data-centre-reforms-2026": "UK data centre connection reform: commitment fee plus queue milestones on end-user, long-lead equipment and capability; consultation document itself left unread.", "iea-asean-power-grid-financing-2026": "ASEAN Power Grid financing through an investor's lens; abstract only, investment totals unknown from the read.", "doe-transmission-needs-2023": "US transmission need by 2035: within-region growth 20 to 128 percent and interregional transfer growth 25 to 412 percent across scenario groups.", "desnz-strategic-demand-connections-2026": "UK strategic demand connections: 96 GW transmission queue plus 29 GW distribution at end June 2025, about 140 data centres at about 50 GW.", "ferc-order-2023-explainer": "US interconnection reform: first-ready cluster studies, site control and deposits, firm study deadlines, alternative transmission technologies.", "iea-electricity-2026-grids": "Grids as bottleneck: over 2,500 GW stalled in queues; reforms plus grid-enhancing technologies could free 1,200 to 1,600 GW.", "doe-grid-supply-chain-2026": "US grid equipment bottleneck: lead times of two or more years, some transformer prices up 4 to 9 times in five years; USD 375 million programme planned.", "crs-distribution-transformers-2026": "Distribution transformers: 60 to 80 million in service, about half over 33 years old, 25 to 30 percent imported; policy options including tax credits and a virtual reserve.", "eprs-eu-grids-2025": "EU grids briefing: over a million km, congestion costs EUR 4.2 billion in 2023, permitting about half of a 10-plus year project timeline.", "nerc-ltra-2025-webinar": "North America reliability: summer peak up over 224 GW in 10 years, data centres the main driver; nearly 900 transmission projects, at least 390 delayed.", "neso-beyond-2030-update-2026": "Great Britain 2030s network: 43 projects, three times more undersea offshore cabling than new onshore; investment total not on the page read.", "philippines-asean-power-grid-2026": "ASEAN Power Grid enhanced MOU consensus, October 2026, with signatures awaited and submarine cable framework work continuing under Singapore's 2027 chairship.", "nist-cloud-definition": "NIST definition: cloud is on-demand network access to a shared pool of configurable resources, with five characteristics, three service models and four deployment models. A 2011 taxonomy, not market data.", "oecd-public-cloud-compute": "OECD method for tracking where public-cloud AI compute physically sits, by counting major providers cloud regions with AI hardware. Method only; numeric findings unknown from the page read.", "oecd-cloud-competition": "OECD paper on cloud competition: concentration, barriers to entry and interoperability, with regulation and enforcement as policy tools. No market shares on the page read.", "govtech-cloud-first": "Singapore cloud-first in practice: a 2018 five-year plan, over 150 restricted-and-below systems moved, over S$870 million earmarked that year to double commercial-cloud systems.", "singapore-nais-compute-2026": "Singapore 2026 NAIS update: secure more compute while improving resource efficiency, via green data centres, a second data-centre call, a digital infrastructure scheme and the ASPIRE 2B supercomputer.", "eurohpc-ai-factories": "EU EuroHPC AI Factories: 19 factories and 13 antennas offering free, customised support to SMEs and startups around AI-optimised supercomputers.", "cset-semiconductor-supply-chain": "CSET 2021 supply-chain map: US 39 percent of value, US allies another 53 percent, China 6 percent, on 2019 data by firm headquarters. A baseline, not a 2026 picture.", "sia-state-2025": "SIA 2025 industry snapshot: US firms over 50 percent of global revenues, US capacity share down from 37 percent in 1990 to 10 percent in 2022, with large announced investments and job projections.", "tsmc-cowos": "TSMC CoWoS packaging: logic dies and high-bandwidth memory on an interposer. CoWoS-S since 2012, CoWoS-R since 2023, CoWoS-L at 3.5x reticle since 2024. Vendor page, no capacity or cost data.", "cset-reshoring-packaging": "CSET 2022 argument: advanced packaging now matters for performance as transistor scaling slows, US capacity is thin, and CHIPS Act funds should target co-located packaging.", "itu-facts-figures-2025": "ITU 2025: about 6 billion people online, 2.2 billion offline. 5G covers 84 percent in high-income countries but 4 percent in low-income countries. Note the 2024 revision to 5.8 billion online.", "broadband-state-2024": "Broadband Commission 2024: AI may help bring 2.6 billion offline people online, while energy use, misinformation and bias risks need managing. Part 1 only.", "telegeography-submarine-cables": "TeleGeography counting explainer: over 709 cable systems depicted in 2026, 607 in service and 102 planned. A system is not a connection function highlightConnections(ref){
  const here = byTopic[ref].world.id;
  const conn = new Set(((byTopic[ref].topic.links) || [])
    .map(l => l.to).filter(k => byTopic[k] && byTopic[k].world.id === here));
  expansion.querySelectorAll(".topic").forEach(el => {
    const key = el.dataset.topic;
    if (key === ref) return;
    const back = ((byTopic[key].topic.links) || []).some(l => l.to === ref);
    const lit = conn.has(key) || back;
    el.classList.toggle("connected", lit);
    el.classList.toggle("soft", !lit);
  });
  linesSvg.querySelectorAll(".topiclink").forEach(l => {
    l.classList.toggle("hot", l.dataset.a === ref || l.dataset.b === ref);
  });
}

function clearHighlights(){
  expansion.querySelectorAll(".topic.connected,.topic.soft").forEach(el => el.classList.remove("connected", "soft"));
  linesSvg.querySelectorAll(".topiclink.hot").forEach(l => l.classList.remove("hot"));

function drawCrossLines(ref){
  linesSvg.querySelectorAll(".xcross").forEach(e => e.remove());
  overview.querySelectorAll(".planet.linked").forEach(e => e.classList.remove("linked"));
  if (!expLayout || !byTopic[ref]) return;
  const src = expLayout.topics.find(o => o.t === byTopic[ref].topic);
  if (!src) return;
  (byTopic[ref].topic.links || []).forEach(l => {
    const hit = byTopic[l.to];
    if (!hit || hit.world.id === expanded) return;
    const P = planetPos(hit.world, orbitAngle);
    const path = svgEl("path", {class:"xcross " + (l.dotted ? "dotted" : "solid"),
      d:"M" + src.x + "," + src.y + " Q" + ((src.x + P.x) / 2) + "," + ((src.y + P.y) / 2 - 24) + " " + P.x + "," + P.y});
    const tip = svgEl("title");
    tip.textContent = hit.topic.title + " \u2014 " + hit.world.title;
    path.appendChild(tip);
    linesSvg.appendChild(path);
    const pel = overview.querySelector("[data-world='" + hit.world.id + "']");
    if (pel) pel.classList.add("linked");
  });
}

function openCard(ref){

/* ---- planet positions & slow orbital motion ---- */
const ORBIT_PERIOD_MS = 160000; // one lap in ~2.7 minutes: slow, visible drift
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
let orbitAngle = 0, lastFrame = null, orbitOn = false;

function planetPos(w, ang){
  const r = RINGS[w.orbit.i];
  const a = w.orbit.a * Math.PI / 180 + ang;
  return {x: CX + r.rx * Math.cos(a), y: CY + r.ry * Math.sin(a)};
}

function applyPositions(ang){
  GALAXY.worlds.forEach(w => {
    if (expanded === w.id) return; // pinned while expanded
    const p = overview.querySelector("[data-world='" + w.id + "']");
    const {x, y} = planetPos(w, ang);
    p.style.transform = "translate(" + x + "px," + y + "px) translate(-50%,-50%)";
  });
}

function orbitTick(t){
  if (!orbitOn) return;
  if (lastFrame != null) orbitAngle += (t - lastFrame) * (2 * Math.PI / ORBIT_PERIOD_MS);
  lastFrame = t;
  applyPositions(orbitAngle);
  updateArcs();
  requestAnimationFrame(orbitTick);
}

function updateOrbitMode(){
  const list = document.body.classList.contains("listmode");
  const shouldRun = !list && !reduceMotion.matches && !expanded;
  if (shouldRun && !orbitOn){
    orbitOn = true; lastFrame = null;
    requestAnimationFrame(orbitTick);
  } else if (!shouldRun){
    orbitOn = false;
    if (!list) applyPositions(orbitAngle); // park on the orbit — but never in list mode
  }
}
reduceMotion.addEventListener ? reduceMotion.addEventListener("change", updateOrbitMode)
                              : reduceMotion.addListener(updateOrbitMode);

/* ---- layout: scale to fit, or stack on small screens ---- */
const stagewrap = document.querySelector(".stagewrap");
const siteHeader = document.querySelector('header');
function sizeHeader(){ document.body.style.setProperty('--header-height', siteHeader.offsetHeight + 'px'); }
sizeHeader();
if (window.ResizeObserver) new ResizeObserver(sizeHeader).observe(siteHeader);
let panX = 0, panY = 0, gesture = null, mobileCanvas = null;
let baseScale = 1, mapZoom = 1, pinch = null, suppressMapClickUntil = 0, layoutWidth = 0, layoutHeight = 0;
const mapTouches = new Map();
function setMapZoom(next, cx, cy, startScale, startX, startY){
  mapZoom = Math.max(.8, Math.min(4, next));
  const scale = baseScale * mapZoom, ratio = scale / startScale;
  panX = cx - (cx - startX) * ratio;
  panY = cy - (cy - startY) * ratio;
  stage.style.translate = panX + 'px ' + panY + 'px';
  stage.style.transform = 'scale(' + scale + ')';
}
stagewrap.addEventListener("pointerdown", e => {
  if (e.pointerType === 'touch') {
    mapTouches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (mapTouches.size === 2) {
      const [a,b] = [...mapTouches.values()], rect = stagewrap.getBoundingClientRect();
      pinch = {distance:Math.hypot(a.x-b.x,a.y-b.y), scale:baseScale*mapZoom, zoom:mapZoom,
        x:(a.x+b.x)/2-rect.left, y:(a.y+b.y)/2-rect.top, panX, panY};
      gesture = null;
      return;
    }
  }
  if (e.button !== 0 || e.target.closest("button, a, input, textarea, select, #card, #jpanel")) return;
  gesture = {id:e.pointerId, x:e.clientX, y:e.clientY, baseX:panX, baseY:panY, moved:false};
  if (!document.body.classList.contains("listmode")) stagewrap.setPointerCapture(e.pointerId);
});
stagewrap.addEventListener("pointermove", e => {
  if (mapTouches.has(e.pointerId)) mapTouches.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if (pinch && mapTouches.size >= 2) {
    const [a,b] = [...mapTouches.values()], rect = stagewrap.getBoundingClientRect();
    const cx=(a.x+b.x)/2-rect.left, cy=(a.y+b.y)/2-rect.top;
    const next = pinch.zoom * Math.hypot(a.x-b.x,a.y-b.y) / Math.max(1,pinch.distance);
    setMapZoom(next, pinch.x, pinch.y, pinch.scale, pinch.panX, pinch.panY);
    panX += cx-pinch.x; panY += cy-pinch.y;
    stage.style.translate = panX+'px '+panY+'px';
    suppressMapClickUntil = Date.now()+500;
    return;
  }
  if (!gesture || gesture.id !== e.pointerId || document.body.classList.contains("listmode")) return;
  const dx = e.clientX - gesture.x, dy = e.clientY - gesture.y;
  if (Math.hypot(dx, dy) > 5) gesture.moved = true;
  if (!gesture.moved) return;
  panX = Math.max(-stagewrap.clientWidth * .65, Math.min(stagewrap.clientWidth * .65, gesture.baseX + dx));
  panY = Math.max(-stagewrap.clientHeight * .65, Math.min(stagewrap.clientHeight * .65, gesture.baseY + dy));
  stage.style.translate = panX + "px " + panY + "px";
  stagewrap.classList.add("dragging");
});
function endPan(e){
  if (mapTouches.has(e.pointerId)) {
    mapTouches.delete(e.pointerId);
    if (pinch) { pinch = null; gesture = null; suppressMapClickUntil = Date.now()+500; return; }
  }
  if (!gesture || gesture.id !== e.pointerId) return;
  const wasTap = !gesture.moved && Math.hypot(e.clientX - gesture.x, e.clientY - gesture.y) < 5;
  gesture = null;
  stagewrap.classList.remove("dragging");
  if (wasTap && e.type === "pointerup") { exitJourney(); collapse(); hideCard(); }
}
stagewrap.addEventListener("pointerup", endPan);
stagewrap.addEventListener("pointercancel", endPan);
stagewrap.addEventListener('click', e => { if (Date.now() < suppressMapClickUntil) { e.preventDefault(); e.stopPropagation(); } }, true);
stagewrap.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const rect=stagewrap.getBoundingClientRect();
  setMapZoom(mapZoom * Math.exp(-e.deltaY*.01), e.clientX-rect.left, e.clientY-rect.top, baseScale*mapZoom, panX, panY);
}, {passive:false});
function relayout(){
  const isMobile = stagewrap.clientWidth < 780;
  const wide = true;
  document.body.classList.remove("listmode");
  if (wide){
    // fit BOTH dimensions: width (canvas 1200) and height (canvas 780 minus header/legend space)
    const availH = Math.max(430, window.innerHeight - 190);
    const mobileHeight = Math.max(280, window.innerHeight - document.querySelector('header').offsetHeight - 24);
    const s = isMobile ? Math.min((stagewrap.clientWidth - 8) / 1200, mobileHeight / 780) : Math.min(stagewrap.clientWidth / 1200, availH / 780);
    if (mobileCanvas !== isMobile || layoutWidth !== stagewrap.clientWidth || layoutHeight !== window.innerHeight) {
      if (mobileCanvas !== isMobile) mapZoom = 1;
      panX = isMobile ? (stagewrap.clientWidth - 1200 * s * mapZoom) / 2 : 0;
      panY = isMobile ? (mobileHeight - 780 * s * mapZoom) / 2 : 0;
      mobileCanvas = isMobile; layoutWidth = stagewrap.clientWidth; layoutHeight = window.innerHeight;
      stage.style.translate = panX + "px " + panY + "px";
    }
    baseScale = s;
    stage.style.transform = "scale(" + (s * mapZoom) + ")";
    stagewrap.style.height = (isMobile ? mobileHeight : 780 * s) + "px";
    updateOrbitMode();
    if (!orbitOn) applyPositions(orbitAngle); // always (re)place: never leave stale coordinates
    if (expanded && expLayout){
      layoutExpansion();
      drawExpansionLines();
      expansion.querySelectorAll(".topic").forEach(el => {
        const o = expLayout.topics.find(q => q.t === byTopic[el.dataset.topic].topic);
        if (o){ el.style.left = o.x + "px"; el.style.top = o.y + "px"; }
      });
      if (openRef){ highlightConnections(openRef); drawCrossLines(openRef); }
    }
  } else {
    stage.style.transform = "none";
    stage.style.translate = "none";
    panX = panY = 0;
    stagewrap.style.height = "auto";
    GALAXY.worlds.forEach(w => {
      const p = overview.querySelector("[data-world='" + w.id + "']");
      p.style.transform = ""; // CSS list mode positions statically
    });
    updateOrbitMode();
  }
  updateArcs();
}
window.addEventListener("resize", relayout);
window.addEventListener("orientationchange", relayout);
if (window.ResizeObserver) new ResizeObserver(relayout).observe(stagewrap);

const jpanel = document.getElementById("jpanel");
let journey = null;

function clearJourneyMarks(){
  expansion.querySelectorAll(".topic.jnode").forEach(e => e.classList.remove("jnode"));
  linesSvg.querySelectorAll(".jtrail").forEach(e => e.remove());
}

function showJourneyStep(){
  const def = journey.def, step = def.steps[journey.idx];
  const hit = byTopic[step.t];
  if (expanded !== hit.world.id) expandWorld(hit.world.id);
  clearJourneyMarks();
  const el = expansion.querySelector("[data-topic='" + step.t + "']");
  if (el) el.classList.add("jnode");
  if (journey.idx > 0){ // trail from the previous step
    const prevRef = def.steps[journey.idx - 1].t;
    const prev = byTopic[prevRef];
    let ax, ay;
    const prevNode = (prev.world.id === hit.world.id) ? expLayout.topics.find(q => q.t === prev.topic) : null;
    if (prevNode){ ax = prevNode.x; ay = prevNode.y; }
    else { const P = planetPos(prev.world, orbitAngle); ax = P.x; ay = P.y; }
    const B = expLayout.topics.find(q => q.t === hit.topic);
    if (B){
      const mx = (ax + B.x) / 2, my = (ay + B.y) / 2 - 18;
      linesSvg.appendChild(svgEl("path", {class:"jtrail", d:"M" + ax + "," + ay + " Q" + mx + "," + my + " " + B.x + "," + B.y}));
    }
  }
  const last = journey.idx === def.steps.length - 1;
  jpanel.innerHTML =
    "<div class='step'>Guided journey \u00b7 step " + (journey.idx + 1) + " of " + def.steps.length + "</div>" +
    "<h3>" + hit.topic.title + "</h3>" +
    "<p>" + step.say + "</p>" +
    "<p class='srclab'>Sources for this step</p><ul>" +
    hit.topic.sources.map(x => "<li><a href='" + x.url + "' target='_blank' rel='noopener'>" + x.label + "</a></li>").join("") + "</ul>" +
    (last && def.note ? "<p class='note'>" + def.note + "</p>" : "") +
    "<div class='row'><button id='jprev'" + (journey.idx === 0 ? " disabled" : "") + ">← Back</button>" +
    "<button id='jnext'>" + (last ? "Finish ✓" : "Next →") + "</button></div>" +
    "<button class='full' id='jfull'>Full details &amp; all connections</button><br>" +
    "<button class='full' id='jexit'>Exit journey</button>";
  jpanel.classList.add("on");
  document.getElementById("jnext").addEventListener("click", () => {
    if (journey.idx < def.steps.length - 1){ journey.idx++; showJourneyStep(); } else exitJourney();
  });
  document.getElementById("jprev").addEventListener("click", () => {
    if (journey.idx > 0){ journey.idx--; showJourneyStep(); }
  });
  document.getElementById("jfull").addEventListener("click", () => openCard(step.t));
  document.getElementById("jexit").addEventListener("click", () => exitJourney());
  if (!document.body.classList.contains("listmode")){
    const nb = document.getElementById("jnext");
    if (nb) nb.focus({preventScroll:true});
  }
}

function startJourney(def){
  journey = {def, idx:0};
  document.querySelectorAll(".jbtn").forEach(b => b.classList.toggle("active", b.dataset.journey === def.id));
  showJourneyStep();
}

function exitJourney(){
  journey = null;
  jpanel.classList.remove("on");
  clearJourneyMarks();
  document.querySelectorAll(".jbtn").forEach(b => b.classList.remove("active"));
}

const guide = document.querySelector('.guide');
const guideToggle = document.querySelector('.guide-toggle');
let guidePosition = null, guideDrag = null, suppressGuideClick = false;
function positionGuide(){
  const vv = window.visualViewport;
  const scale = vv ? vv.scale : 1;
  const left = vv ? vv.offsetLeft : 0, top = vv ? vv.offsetTop : 0;
  const width = vv ? vv.width : window.innerWidth, height = vv ? vv.height : window.innerHeight;
  const inv = 1 / scale, gw = guide.offsetWidth * inv, gh = guide.offsetHeight * inv;
  const initial = {x:left + 16 * inv, y:top + height - gh - 16 * inv};
  const point = guidePosition || initial;
  const x = Math.max(left, Math.min(point.x, left + width - gw));
  const y = Math.max(top, Math.min(point.y, top + height - gh));
  if (guidePosition) guidePosition = {x,y};
  guide.style.left = x + 'px'; guide.style.top = y + 'px'; guide.style.bottom = 'auto';
  guide.style.transform = 'scale(' + inv + ')';
  const hello = guide.querySelector('.guide-hello');
  if (!guide.classList.contains('open')) {
    const hw = hello.offsetWidth * inv, hh = hello.offsetHeight * inv, margin = 8 * inv;
    const hx = Math.max(left + margin, Math.min(x + gw - 8 * inv, left + width - hw - margin));
    const hy = Math.max(top + margin, Math.min(y - hh - margin, top + height - hh - margin));
    hello.style.left = ((hx-x)/inv) + 'px'; hello.style.top = ((hy-y)/inv) + 'px'; hello.style.bottom = 'auto';
  }
  const menu = document.getElementById('guide-menu');
  if (guide.classList.contains('open')) {
    const margin = 8 * inv, mw = menu.offsetWidth * inv, mh = menu.offsetHeight * inv;
    const mx = Math.max(left + margin, Math.min(x + 10 * inv, left + width - mw - margin));
    const preferredY = y - mh - margin >= top + margin ? y - mh - margin : y + gh + margin;
    const my = Math.max(top + margin, Math.min(preferredY, top + height - mh - margin));
    menu.style.left = ((mx - x) / inv) + 'px'; menu.style.right = 'auto';
    menu.style.top = ((my - y) / inv) + 'px'; menu.style.bottom = 'auto';
  }
}
