const {GALAXY,TOPIC_SOURCES,READING_NOTES,AUDIT_NOTES,outlookAxes,futureQuestions}=DATA;const SAVED_KEY='galaxy_saved_readings_v1';function savedIds(){try{const v=JSON.parse(localStorage.getItem(SAVED_KEY)||'[]');return Array.isArray(v)?v.filter(x=>typeof x==='string'):[]}catch{return []}}function setSaved(ids){try{localStorage.setItem(SAVED_KEY,JSON.stringify(ids));return true}catch{return false}}function toggleSaved(id){let ids=savedIds();ids=ids.includes(id)?ids.filter(x=>x!==id):[...ids,id];return setSaved(ids)}function savedView(){selected='';navRender();let ids=savedIds(),records=new Map();Object.values(TOPIC_SOURCES.byTopic).flat().forEach(r=>records.set(r.id,r));main.innerHTML=`<button class="back" id="saved-back">← Catalogue</button><h1>Saved readings</h1><p class="lead">Saved on this device and browser.</p><div id="saved-list"></div>`;main.querySelector('#saved-back').onclick=home;const list=main.querySelector('#saved-list');function renderSaved(){const current=savedIds();list.innerHTML=current.length?current.map(id=>{const r=records.get(id);return r?`<article class="reading"><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)} ↗</a><p>${esc(READING_NOTES[id]||'Reading note not yet available.')}</p><button class="save-reading" data-remove="${esc(id)}">Remove</button></article>`:`<article class="reading"><p>This saved reading is no longer in the catalogue: ${esc(id)}</p><button class="save-reading" data-remove="${esc(id)}">Remove</button></article>`}).join(''):'<p>No readings saved yet.</p>';list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(toggleSaved(b.dataset.remove))renderSaved();else alert('Unable to update saved readings on this browser.')})}renderSaved();scrollStart()}let selected='',step=-1,answers=[];const nav=document.querySelector('#nav'),main=document.querySelector('#content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const worlds=GALAXY.worlds;let sidebarOpen=false;function navRender(){nav.innerHTML='<button class="nav-toggle" aria-expanded="'+sidebarOpen+'" aria-label="Show or hide catalogue menu">☰</button>'+'<div class="eyebrow">Explore the galaxy</div>'+worlds.map(w=>`<button data-world="${esc(w.id)}" class="${selected===w.id?'active':''}"><span class="dot" style="--c:${esc(w.color)}"></span>${esc(w.title)}</button>`).join('');nav.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>world(b.dataset.world));nav.querySelector('.nav-toggle').onclick=()=>{sidebarOpen=!sidebarOpen;document.querySelector('.shell').classList.toggle('sidebar-collapsed',!sidebarOpen);navRender()}}function scrollStart(){window.scrollTo({top:0,behavior:'instant'})}function home(){selected='';navRender();main.innerHTML=`<div class="intro"><div class="eyebrow">A library for the curious</div><h1>AI is bigger than<br>the technology.</h1><p class="lead">Explore the people, systems and ideas shaping artificial intelligence—and find the research behind them.</p></div><p class="save-hint">Save readings to find them later.</p><a class="saved-entry" href="compare.html">Does AI improve work? ↗</a><div class="section-title"><h2>Choose a place to begin</h2><span class="eyebrow">${worlds.length} worlds</span></div><div class="grid">${worlds.map(w=>`<button class="tile" data-id="${esc(w.id)}"><span class="dot" style="display:inline-block;--c:${esc(w.color)}"></span><span class="arrow">↗</span><strong>${esc(w.title)}</strong><small>${esc(w.tagline)}</small></button>`).join('')}</div>`;main.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>world(b.dataset.id));scrollStart()}function world(id){selected=id;navRender();let w=worlds.find(x=>x.id===id);main.innerHTML=`<button class="back" id="world-back">← Catalogue</button><div class="crumb">Galaxy / ${esc(w.title)}</div><div class="intro"><div class="eyebrow">Explore a world</div><h1>${esc(w.title)}</h1><p class="lead">${esc(w.tagline)}</p></div><div class="section-title"><h2>Explore the topics</h2><span class="eyebrow">${w.topics.length} topics</span></div><div class="grid">${w.topics.map(t=>`<button class="tile" data-id="${esc(t.id)}"><span class="arrow">↗</span><strong>${esc(t.title)}</strong><small>${esc(t.tagline)}</small></button>`).join('')}</div>`;main.querySelector('#world-back').onclick=home;main.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>topic(id,b.dataset.id));scrollStart()}function topic(wid,tid){selected=wid;navRender();let w=worlds.find(x=>x.id===wid),t=w.topics.find(x=>x.id===tid),list=TOPIC_SOURCES.byTopic[wid+'/'+tid]||[];main.innerHTML=`<button class="back" id="back">← ${esc(w.title)}</button><div class="crumb">Galaxy / ${esc(w.title)} / ${esc(t.title)}</div><h1>${esc(t.title)}</h1><div class="story">${(t.body||[]).join('')}</div>${t.unknown?`<div class="unknown"><strong>What to keep in mind</strong><br>${esc(t.unknown)}</div>`:''}<div class="section-title"><h2>Readings</h2><span class="eyebrow" id="reading-count" aria-live="polite">${list.length} sources</span></div><div class="reading-filters"><input class="search" placeholder="Filter readings" aria-label="Filter readings"><select id="reading-year" aria-label="Filter by publication year"><option value="">All years</option></select><select id="reading-order" aria-label="Sort readings"><option value="default">Original order</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div><div id="readings"></div>`;main.querySelector('#back').onclick=()=>world(wid);const search=main.querySelector('.search'),year=main.querySelector('#reading-year'),order=main.querySelector('#reading-order');const yearOf=r=>(String(r.date||'').match(/(?:19|20)\d{2}/)||[])[0]||'';[...new Set(list.map(yearOf).filter(Boolean))].sort().reverse().forEach(y=>year.add(new Option(y,y)));if(list.some(r=>!yearOf(r)))year.add(new Option('Year unknown','unknown'));let render=()=>{let q=search.value.trim().toLowerCase();let rows=list.filter(r=>(r.title+' '+(READING_NOTES[r.id]||'')+' '+(r.inst||'')).toLowerCase().includes(q)&&(!year.value||(year.value==='unknown'?!yearOf(r):yearOf(r)===year.value)));if(order.value!=='default')rows.sort((a,b)=>{let x=yearOf(a),y=yearOf(b);if(!x||!y)return !x&&!y?0:!x?1:-1;let ad=String(a.date||x),bd=String(b.date||y);return order.value==='newest'?bd.localeCompare(ad):ad.localeCompare(bd)});main.querySelector('#reading-count').textContent=rows.length+' of '+list.length+' sources';main.querySelector('#readings').innerHTML=rows.map(r=>`<article class="reading"><button type="button" class="save-reading" data-save="${esc(r.id)}" aria-pressed="${savedIds().includes(r.id)}">${savedIds().includes(r.id)?'Saved':'Save reading'}</button><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)} ↗</a><small>${esc(yearOf(r)||'Year unknown')}</small><p>${esc(READING_NOTES[r.id]||'A source for this topic. A reading note is still needed.')}</p>${AUDIT_NOTES[r.id]&&AUDIT_NOTES[r.id]!==READING_NOTES[r.id]?`<details><summary>What was read</summary><p>${esc(AUDIT_NOTES[r.id])}</p></details>`:AUDIT_NOTES[r.id]?`<small>Reading details are included above.</small>`:`<small>Reading depth not yet reconciled.</small>`}</article>`).join('')||'<p>No matching readings.</p>' ;main.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{if(toggleSaved(b.dataset.save))render();else alert('Unable to save readings on this browser.')})};render();search.oninput=render;year.onchange=render;order.onchange=render;scrollStart()}function quiz(){selected='';navRender();step=-1;answers=Array(futureQuestions.length).fill(null);renderQuiz();scrollStart()}function renderQuiz(){if(step<0){main.innerHTML=`<div class="quiz quiz-intro"><div class="quiz-intro-orbit" aria-hidden="true"><i></i></div><div class="eyebrow">The AI outlook test</div><h1>AI is moving fast.<br>What matters to you?</h1><p class="quiz-intro-copy">Who should control it? What should change at work? And how much caution is enough?</p><p class="quiz-intro-copy secondary">Answer 18 statements and see your views across six perspectives.</p><div class="quiz-intro-action"><button class="action" id="begin">Start the test <span aria-hidden="true">↗</span></button><span>18 statements &nbsp;·&nbsp; about 3 minutes</span></div><p class="quiz-intro-note">For reflection, not a scientific assessment. Your answers stay on this page.</p></div>`;document.querySelector('#begin').onclick=()=>{step=0;renderQuiz()}}else if(step<futureQuestions.length){let q=futureQuestions[step];main.innerHTML=`<div class="quiz"><div class="eyebrow">Your AI outlook · ${step+1} / ${futureQuestions.length}</div><div class="progress"><span style="width:${(step/futureQuestions.length)*100}%"></span></div><h2>${esc(q.q)}</h2><div class="options">${['Strongly disagree','Disagree','Neutral','Agree','Strongly agree','Unsure'].map((s,i)=>`<button data-value="${i}">${s}</button>`).join('')}</div>${step?'<button class="back" id="previous">← Previous question</button>':''}</div>`;main.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{answers[step]=+b.dataset.value===5?null:+b.dataset.value;step++;renderQuiz();scrollStart()});let p=main.querySelector('#previous');if(p)p.onclick=()=>{step--;renderQuiz()}}else{let scores=outlookAxes.map(a=>{let vals=futureQuestions.map((q,i)=>q.axis===a.id&&answers[i]!==null?(q.dir===1?answers[i]:4-answers[i]):null).filter(v=>v!==null);return {axis:a,score:vals.length?Math.round(vals.reduce((x,y)=>x+y,0)/(vals.length*4)*100):null}});let outlook=scores.find(x=>x.axis.id==='outlook').score;let title=outlook===null?'An open question':outlook>=70?'Hopeful about AI':outlook<=30?'Concerned about AI':'Hopeful, with reservations';let description=outlook===null?'You left the overall outlook open. Your other answers still show how you approach AI.':outlook>=70?'Your answers lean toward AI improving lives, while your other views show how you think its development should be guided.':outlook<=30?'Your answers lean toward concern about AI’s long-term effects. That can coexist with seeing value in particular uses.':'Your answers suggest a mixed outlook: potential benefits and concerns can both matter to you.';let fact=outlook!==null&&outlook>=70?'52% of people surveyed, on average across 30 countries, said they were excited about products and services using AI.':'53% of people surveyed, on average across 30 countries, said AI made them nervous.';main.innerHTML=`<div class="quiz result-page"><div class="result-hero"><div class="result-orbit" aria-hidden="true"><i></i></div><div class="eyebrow">Your AI outlook</div><h1>${title}.</h1><p class="lead">${description}</p><p class="outlook-disclaimer">A reflection of your answers—not a diagnosis or scientific classification.</p></div><div class="result-highlights">${scores.filter(x=>x.score!==null).slice(0,3).map(x=>`<div><strong>${x.score}%</strong><span>toward ${esc(x.axis.right.toLowerCase())}<br><small>${esc(x.axis.title)}</small></span></div>`).join('')}</div><details class="result-detail"><summary>Explore all six perspectives</summary><div class="results">${scores.map(({axis:a,score:n})=>`<article><strong>${esc(a.title)}</strong><small>${esc(a.left)} · ${esc(a.right)}</small>${n===null?'Not enough answers':`<div class="bar"><i style="width:${n}%"></i></div><small>${n}% toward ${esc(a.right.toLowerCase())}</small>`}</article>`).join('')}</div></details><section class="survey-fact"><div class="eyebrow">A wider perspective</div><h2>Did you know?</h2><p>${fact}</p><p><small>Ipsos AI Monitor 2025. Excitement and nervousness were asked separately; the survey and this quiz do not measure the same thing.</small></p><a href="https://www.ipsos.com/en/conflicting-global-perceptions-around-ai-present-mixed-signals-brands" target="_blank" rel="noopener noreferrer">Read the Ipsos findings ↗</a></section><section class="share-panel"><div class="eyebrow">Keep the conversation going</div><h2>Share your outlook.</h2><p>Create a card to share anywhere, or invite someone to take the test.</p><div class="share-row"><button class="action" id="share-card">Share result card</button><button class="action" id="download-card">Download card</button><button class="action" id="share-x">Share on X</button></div><p id="share-status" aria-live="polite"></p></section><button class="back" id="restart">Start again</button></div>`;document.querySelector('#restart').onclick=quiz;function cardBlob(){return new Promise(resolve=>{let c=document.createElement('canvas');c.width=1200;c.height=1500;let x=c.getContext('2d');let bg=x.createLinearGradient(0,0,1200,1500);bg.addColorStop(0,'#101b35');bg.addColorStop(1,'#283f5c');x.fillStyle=bg;x.fillRect(0,0,1200,1500);x.strokeStyle='#a8c5df33';x.lineWidth=2;for(let i=0;i<3;i++){x.beginPath();x.ellipse(1000,320,190+i*95,270+i*80,.45,0,Math.PI*2);x.stroke()}for(let i=0;i<38;i++){let px=(i*347+77)%1200,py=(i*563+43)%710;x.fillStyle=i%3?'#b8cbdd88':'#f9e4ba';x.beginPath();x.arc(px,py,i%7===0?3:1.5,0,Math.PI*2);x.fill()}x.fillStyle='#e7c689';x.beginPath();x.arc(1000,290,55,0,Math.PI*2);x.fill();x.fillStyle='#c5d5e8';x.font='bold 28px sans-serif';x.fillText('GALAXY OF AI  /  MY OUTLOOK',80,95);x.fillStyle='#fff8eb';x.font='bold 72px Georgia';let line='',y=245;for(const word of (title+'.').split(' ')){let test=line+word+' ';if(x.measureText(test).width>850){x.fillText(line,80,y);line=word+' ';y+=90}else line=test}x.fillText(line,80,y);x.fillStyle='#b8cee0';x.font='28px sans-serif';x.fillText('Six perspectives. One way to reflect.',80,y+67);let top=465;x.fillStyle='#0b172caa';x.beginPath();x.roundRect(70,top,1060,690,28);x.fill();x.fillStyle='#c5d5e8';x.font='bold 25px sans-serif';x.fillText('YOUR PERSPECTIVES',110,top+65);scores.forEach(({axis,score},i)=>{let row=top+145+i*90;x.fillStyle='#f2f5f5';x.font='bold 29px sans-serif';x.fillText(axis.title,110,row);x.fillStyle='#afc6d3';x.font='22px sans-serif';x.fillText(score===null?'Not enough answers':'Toward '+axis.right.toLowerCase(),110,row+31);if(score!==null){x.fillStyle='#dfeeda';x.font='bold 30px sans-serif';x.textAlign='right';x.fillText(score+'%',1080,row);x.textAlign='left';x.fillStyle='#ffffff22';x.fillRect(770,row+18,300,6);x.fillStyle='#9fc7b4';x.fillRect(770,row+18,300*score/100,6)}});x.fillStyle='#f4f5ee';x.font='bold 29px sans-serif';x.fillText('Explore your perspective',80,1290);x.fillStyle='#b8cde0';x.font='26px sans-serif';x.fillText('ai.faizkrisnadi.com',80,1335);x.font='21px sans-serif';x.fillText('© Faiz Krisnadi  ·  For reflection, not a scientific test',80,1410);c.toBlob(resolve,'image/png')})}async function download(){const blob=await cardBlob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-ai-outlook.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelector('#download-card').onclick=download;document.querySelector('#share-card').onclick=async()=>{let blob=await cardBlob(),file=new File([blob],'my-ai-outlook.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'My AI outlook',text:'Explore your perspective at ai.faizkrisnadi.com'})}catch(e){if(e.name!=='AbortError')document.querySelector('#share-status').textContent='Sharing was unavailable. You can download the card instead.'}}else{document.querySelector('#share-status').textContent='Card sharing is unavailable here. Download the card to share it.'}};document.querySelector('#share-x').onclick=()=>{document.querySelector('#share-status').textContent='X opens a text post. To include your card, download it and attach it in X.';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent('My AI outlook: '+title+'. Explore your perspective at')+'&url='+encodeURIComponent('https://ai.faizkrisnadi.com/'),'_blank','noopener,noreferrer')}}}
const searchToggle=document.querySelector('#catalog-search-toggle'),searchPanel=document.querySelector('#catalog-search-panel'),catalogSearch=document.querySelector('#catalog-search-input'),catalogResults=document.querySelector('#catalog-search-results');searchToggle.onclick=()=>{const open=searchPanel.hidden;searchPanel.hidden=!open;searchToggle.setAttribute('aria-expanded',String(open));if(open)catalogSearch.focus()};catalogSearch.oninput=()=>{const q=catalogSearch.value.trim().toLocaleLowerCase();catalogResults.replaceChildren();if(!q)return;const lang=document.querySelector('#language-select').value,dict=(window.GALAXY_TRANSLATIONS?.[lang]?.ui)||{};worlds.forEach(w=>w.topics.forEach(t=>{const label=dict[t.title]||t.title,area=dict[w.title]||w.title;if(![t.title,t.tagline,w.title,label,area].some(x=>String(x||'').toLocaleLowerCase().includes(q)))return;const b=document.createElement('button'),small=document.createElement('small');b.type='button';b.textContent=label;small.textContent=area;b.append(small);b.onclick=()=>{searchPanel.hidden=true;searchToggle.setAttribute('aria-expanded','false');catalogSearch.value='';catalogResults.replaceChildren();topic(w.id,t.id)};catalogResults.append(b)}))};
window.addEventListener('message', event => {const frame=document.querySelector('#galaxy-frame');if(event.source===frame?.contentWindow && event.origin===window.location.origin && event.data?.type==='galaxy-connection-panel')document.body.classList.toggle('galaxy-connection-open',event.data.open===true)});
const frame=document.querySelector('#galaxy-frame'),catalogue=document.querySelector('#catalogue'),catalogueGuide=document.querySelector('#guide');function switchView(view){let galaxy=view==='galaxy';frame.hidden=!galaxy;catalogue.hidden=galaxy;catalogueGuide.hidden=true;document.querySelector('#galaxy-view').setAttribute('aria-pressed',String(galaxy));document.querySelector('#catalog-view').setAttribute('aria-pressed',String(!galaxy));}document.querySelector('#galaxy-view').onclick=()=>switchView('galaxy');document.querySelector('#catalog-view').onclick=()=>switchView('catalogue');document.querySelector('#home').onclick=()=>{home();switchView('galaxy');frame.contentWindow.location.reload()};const languageControl=document.querySelector('#language-select');const syncLanguageCode=()=>{document.querySelector('.language-code').textContent=languageControl.value.toUpperCase()+' ▾'};languageControl.addEventListener('change',syncLanguageCode);syncLanguageCode();document.querySelector('#saved-shortcut').onclick=()=>{switchView('catalogue');savedView()};document.querySelector('#test').onclick=()=>{switchView('catalogue');quiz()};document.querySelector('#guide-test').onclick=()=>{guide.classList.remove('open');quiz()};const guide=document.querySelector('#guide'),gb=document.querySelector('#guide-button');let drag=null,moved=false;gb.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,rect:guide.getBoundingClientRect()};moved=false;gb.setPointerCapture(e.pointerId)};gb.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)<6&&!moved)return;moved=true;guide.style.left=Math.max(0,Math.min(innerWidth-guide.offsetWidth,drag.rect.left+dx))+'px';guide.style.top=Math.max(0,Math.min(innerHeight-guide.offsetHeight,drag.rect.top+dy))+'px';guide.style.right='auto';guide.style.bottom='auto'};gb.onpointerup=()=>{drag=null};gb.onclick=()=>{if(moved)return;let open=guide.classList.toggle('open');gb.setAttribute('aria-expanded',open)};home();
