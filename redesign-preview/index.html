<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Galaxy of AI — local redesign</title><style>
:root{--ink:#172322;--muted:#66736f;--paper:#f6f5ef;--line:#dce0d9;--accent:#426e5d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:#315f50}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(246,245,239,.94);backdrop-filter:blur(14px);z-index:8}.brand{font-weight:750;font-size:18px;letter-spacing:-.04em}.brand span{color:#84a396}.header-right{display:flex;gap:15px;align-items:center}.header-right button,.back{border:0;background:none;color:var(--ink);padding:10px}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 72px)}nav{padding:35px 22px 110px 4vw;border-right:1px solid var(--line);position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:750;color:var(--muted)}nav button{display:flex;width:100%;text-align:left;gap:12px;align-items:center;border:0;background:transparent;border-radius:9px;padding:11px 10px;color:#53625d;font-size:14px}nav button.active,nav button:hover{background:#e5ebe3;color:#203a30}.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}main{min-width:0;padding:62px clamp(22px,7vw,112px) 120px;max-width:1160px}.intro{max-width:760px}h1,h2,h3,p{margin-top:0}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-.05em;font-size:clamp(40px,6vw,70px);line-height:1.06;margin:18px 0 20px}h2{font-family:Georgia,serif;font-size:clamp(30px,4vw,48px);font-weight:400;letter-spacing:-.04em;line-height:1.1}.lead{font-size:18px;line-height:1.65;color:#556660;max-width:620px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:54px 0 12px;border-bottom:1px solid var(--line);padding-bottom:12px}.section-title h2{font:600 16px -apple-system,sans-serif;letter-spacing:0;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border:1px solid var(--line);background:#fffefa;text-align:left;border-radius:14px;padding:20px;min-height:135px;transition:.2s}.tile:hover{transform:translateY(-3px);border-color:#9db8ab;box-shadow:0 10px 25px #163e2910}.tile strong{display:block;font-size:17px;margin:12px 0 3px}.tile small{color:var(--muted)}.tile .arrow{float:right;color:#82978c}.crumb{font-size:13px;color:var(--muted);margin-bottom:28px}.story{max-width:700px;font-family:Georgia,serif;font-size:19px;line-height:1.75;color:#31423d}.unknown{max-width:700px;background:#e9eee8;padding:17px 20px;border-radius:12px;margin:24px 0;color:#475b51;font-size:14px}.reading{max-width:760px;padding:22px 0;border-top:1px solid var(--line)}.reading a{font-size:17px;font-weight:700;text-decoration:none}.reading p{margin:8px 0;color:#5e6d67;font-size:14px;line-height:1.65}.reading details{font-size:13px;color:#64736c;margin-top:10px}.reading summary{cursor:pointer}.search{width:100%;border:1px solid var(--line);background:white;border-radius:10px;padding:12px 14px;margin:12px 0 18px}.guide{position:fixed;bottom:20px;right:24px;z-index:12;touch-action:none;user-select:none}.guide button{width:78px;height:82px;border:0;background:transparent;padding:0;touch-action:none}.guide img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 9px #0003)}.bubble{display:none;position:absolute;bottom:90px;right:0;width:240px;background:#203a33;color:#fff;border-radius:16px;padding:18px;box-shadow:0 12px 30px #0002}.guide.open .bubble{display:block}.bubble p{margin:0 0 12px}.bubble button{width:100%;height:auto;background:#fff;color:#243d35;border-radius:9px;padding:10px;text-align:left}.quiz{max-width:680px}.options{display:grid;gap:8px;margin:28px 0}.options button,.action{border:1px solid #cad5cb;background:#fffefa;padding:14px 17px;text-align:left;border-radius:10px;color:var(--ink)}.options button:hover,.action:hover{background:#e4eee5}.progress{height:4px;background:#dce4dc;margin:25px 0}.progress span{display:block;background:#64907b;height:100%}.results article{padding:18px 0;border-top:1px solid var(--line)}.results small{display:block;color:var(--muted)}.bar{height:5px;background:#dbe3db;border-radius:5px;margin:12px 0}.bar i{display:block;height:5px;background:#628d79;border-radius:5px}.mobile-nav{display:none}@media(max-width:700px){header{height:60px;padding:0 18px}.header-right button{font-size:13px}.shell{display:block}nav{position:static;height:auto;border-right:0;padding:14px 16px 4px;display:flex;gap:7px;overflow-x:auto}nav .eyebrow{display:none}nav button{white-space:nowrap;width:auto;border:1px solid var(--line);padding:8px 11px}.dot{width:7px;height:7px}main{padding:34px 20px 110px}.grid{grid-template-columns:1fr}.tile{min-height:105px;padding:16px}.tile strong{margin:7px 0 1px}.section-title{margin-top:36px}.story{font-size:17px}.guide{bottom:12px;right:12px}.guide button{width:64px;height:68px}.bubble{bottom:72px;width:220px}.bubble button{width:100%}.lead{font-size:16px}}

.brand{border:0;background:none;color:inherit;padding:0;cursor:pointer}.switch{display:flex;gap:3px;background:#e8ece5;border-radius:9px;padding:3px}.switch button{border:0;background:transparent;color:#607169;border-radius:7px;padding:7px 12px;font-size:13px}.switch button[aria-pressed="true"]{background:#fffefa;color:#203a30;box-shadow:0 1px 4px #193c2917}#galaxy-frame{border:0;display:block;width:100%;height:calc(100dvh - 72px)}[hidden]{display:none!important}@media(max-width:700px){#galaxy-frame{height:calc(100dvh - 60px)}.switch button{padding:6px 8px;font-size:12px}header{gap:8px}.brand{font-size:15px;white-space:nowrap}.header-right{gap:3px}.header-right button{padding:8px 2px;font-size:12px}}

.identity{display:flex;align-items:center;gap:18px}.shell.sidebar-collapsed{grid-template-columns:140px minmax(0,1fr)}nav .nav-toggle{color:#31483e;font-weight:650;display:flex;min-height:44px;margin-bottom:14px}.sidebar-collapsed nav{padding-left:10px;padding-right:10px}.sidebar-collapsed nav button:not(.nav-toggle),.sidebar-collapsed nav .eyebrow{display:none}.guide img{animation:none!important;transform:none!important}.guide button{min-width:44px;min-height:44px}@media(max-width:700px){.identity{gap:8px}.shell.sidebar-collapsed{display:block}.sidebar-collapsed nav{padding:8px 16px}.sidebar-collapsed nav .nav-toggle{margin:0}nav .nav-toggle{margin:0;flex:none}.sidebar-collapsed nav button:not(.nav-toggle){display:none}header{justify-content:space-between}.header-right{margin-left:auto}}

header{background:#111b39;color:#f3f5ff;border-bottom:1px solid #34415e}.brand{color:#fff}.brand span{color:#aebee7}.switch{background:#253251}.switch button{color:#c1cee9}.switch button[aria-pressed="true"]{background:#e6ecfc;color:#172447}.header-right #test{background:#dfe8ff;color:#172447;border-radius:9px;padding:9px 14px;font-weight:650}.header-right #test:hover{background:#fff}nav{border-right:0}.shell.sidebar-collapsed{grid-template-columns:64px minmax(0,1fr)}.sidebar-collapsed nav{padding-left:10px;padding-right:10px}nav .nav-toggle{justify-content:center;width:44px;padding:0;font-size:20px}.sidebar-collapsed nav .nav-toggle{margin-bottom:14px}@media(max-width:700px){.header-right #test{padding:8px;font-size:12px}.sidebar-collapsed nav .nav-toggle{margin:0}}
</style></head><body><header><div class="identity"><button class="brand" id="home" aria-label="Galaxy of AI home">Galaxy <span>of AI</span></button><div class="switch" aria-label="Choose view"><button id="galaxy-view" aria-pressed="true">Galaxy</button><button id="catalog-view" aria-pressed="false">Catalogue</button></div></div><div class="header-right"><button id="test">Take the AI test ↗</button></div></header><iframe id="galaxy-frame" title="Explore the Galaxy of AI" src="galaxy.html"></iframe><div class="shell sidebar-collapsed" id="catalogue" hidden><nav id="nav"></nav><main id="content"></main></div><div class="guide" id="guide" hidden><div class="bubble"><p>Where should we go?</p><button id="guide-test">Explore your AI outlook ↗</button></div><button id="guide-button" aria-label="Open guide" aria-expanded="false"><img src="assets/galaxy-guide.png" alt=""></button></div><script src="data.js"></script><script>
const {GALAXY,TOPIC_SOURCES,READING_NOTES,AUDIT_NOTES,outlookAxes,futureQuestions}=DATA;let selected='',step=-1,answers=[];const nav=document.querySelector('#nav'),main=document.querySelector('#content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const worlds=GALAXY.worlds;let sidebarOpen=false;function navRender(){nav.innerHTML='<button class="nav-toggle" aria-expanded="'+sidebarOpen+'" aria-label="Show or hide catalogue menu">☰</button>'+'<div class="eyebrow">Explore the galaxy</div>'+worlds.map(w=>`<button data-world="${esc(w.id)}" class="${selected===w.id?'active':''}"><span class="dot" style="--c:${esc(w.color)}"></span>${esc(w.title)}</button>`).join('');nav.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>world(b.dataset.world));nav.querySelector('.nav-toggle').onclick=()=>{sidebarOpen=!sidebarOpen;document.querySelector('.shell').classList.toggle('sidebar-collapsed',!sidebarOpen);navRender()}}function scrollStart(){window.scrollTo({top:0,behavior:'instant'})}function home(){selected='';navRender();main.innerHTML=`<div class="intro"><div class="eyebrow">A library for the curious</div><h1>AI is bigger than<br>the technology.</h1><p class="lead">Explore the people, systems and ideas shaping artificial intelligence—and find the research behind them.</p></div><div class="section-title"><h2>Choose a place to begin</h2><span class="eyebrow">${worlds.length} worlds</span></div><div class="grid">${worlds.map(w=>`<button class="tile" data-id="${esc(w.id)}"><span class="dot" style="display:inline-block;--c:${esc(w.color)}"></span><span class="arrow">↗</span><strong>${esc(w.title)}</strong><small>${esc(w.tagline)}</small></button>`).join('')}</div>`;main.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>world(b.dataset.id));scrollStart()}function world(id){selected=id;navRender();let w=worlds.find(x=>x.id===id);main.innerHTML=`<div class="crumb">Galaxy / ${esc(w.title)}</div><div class="intro"><div class="eyebrow">Explore a world</div><h1>${esc(w.title)}</h1><p class="lead">${esc(w.tagline)}</p></div><div class="section-title"><h2>Explore the topics</h2><span class="eyebrow">${w.topics.length} topics</span></div><div class="grid">${w.topics.map(t=>`<button class="tile" data-id="${esc(t.id)}"><span class="arrow">↗</span><strong>${esc(t.title)}</strong><small>${esc(t.tagline)}</small></button>`).join('')}</div>`;main.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>topic(id,b.dataset.id));scrollStart()}function topic(wid,tid){selected=wid;navRender();let w=worlds.find(x=>x.id===wid),t=w.topics.find(x=>x.id===tid),list=TOPIC_SOURCES.byTopic[wid+'/'+tid]||[];main.innerHTML=`<button class="back" id="back">← ${esc(w.title)}</button><div class="crumb">Galaxy / ${esc(w.title)} / ${esc(t.title)}</div><h1>${esc(t.title)}</h1><div class="story">${(t.body||[]).join('')}</div>${t.unknown?`<div class="unknown"><strong>Still open</strong><br>${esc(t.unknown)}</div>`:''}<div class="section-title"><h2>Readings</h2><span class="eyebrow">${list.length} sources</span></div><input class="search" placeholder="Filter readings" aria-label="Filter readings"><div id="readings"></div>`;main.querySelector('#back').onclick=()=>world(wid);let render=q=>{let rows=list.filter(r=>(r.title+' '+(READING_NOTES[r.id]||'')).toLowerCase().includes(q.toLowerCase()));main.querySelector('#readings').innerHTML=rows.map(r=>`<article class="reading"><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)} ↗</a><p>${esc(READING_NOTES[r.id]||'A source for this topic. A reading note is still needed.')}</p>${AUDIT_NOTES[r.id]?`<details><summary>What was read</summary><p>${esc(AUDIT_NOTES[r.id])}</p></details>`:`<small>Reading depth not yet reconciled.</small>`}</article>`).join('')||'<p>No matching readings.</p>'};render('');main.querySelector('.search').oninput=e=>render(e.target.value);scrollStart()}function quiz(){selected='';navRender();step=-1;answers=Array(futureQuestions.length).fill(null);renderQuiz();scrollStart()}function renderQuiz(){if(step<0){main.innerHTML=`<div class="quiz"><div class="eyebrow">A personal exploration</div><h1>Where do you stand on AI?</h1><p class="lead">Explore your views across six perspectives. No right answers, just a place to start thinking.</p><p>18 statements · About 3 minutes</p><button class="action" id="begin">Start the test →</button><p><small>For reflection, not a scientific assessment. Your answers stay here.</small></p></div>`;document.querySelector('#begin').onclick=()=>{step=0;renderQuiz()}}else if(step<futureQuestions.length){let q=futureQuestions[step];main.innerHTML=`<div class="quiz"><div class="eyebrow">Your AI outlook · ${step+1} / ${futureQuestions.length}</div><div class="progress"><span style="width:${(step/futureQuestions.length)*100}%"></span></div><h2>${esc(q.q)}</h2><div class="options">${['Strongly disagree','Disagree','Neutral','Agree','Strongly agree','Unsure'].map((s,i)=>`<button data-value="${i}">${s}</button>`).join('')}</div>${step?'<button class="back" id="previous">← Previous question</button>':''}</div>`;main.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{answers[step]=+b.dataset.value===5?null:+b.dataset.value;step++;renderQuiz();scrollStart()});let p=main.querySelector('#previous');if(p)p.onclick=()=>{step--;renderQuiz()}}else{main.innerHTML=`<div class="quiz"><div class="eyebrow">Your perspective</div><h1>Your view, in six perspectives.</h1><p class="lead">These positions reflect your answers here. They are not a scientific measurement.</p><div class="results">${outlookAxes.map(a=>{let vals=futureQuestions.map((q,i)=>q.axis===a.id&&answers[i]!==null?(q.dir===1?answers[i]:4-answers[i]):null).filter(v=>v!==null),n=vals.length?Math.round(vals.reduce((x,y)=>x+y,0)/(vals.length*4)*100):null;return `<article><strong>${esc(a.title)}</strong><small>${esc(a.left)} · ${esc(a.right)}</small>${n===null?'Not enough answers':`<div class="bar"><i style="width:${n}%"></i></div><small>${n}% toward ${esc(a.right.toLowerCase())}</small>`}</article>`}).join('')}</div><button class="action" id="restart">Start again</button></div>`;document.querySelector('#restart').onclick=quiz}}const frame=document.querySelector('#galaxy-frame'),catalogue=document.querySelector('#catalogue'),catalogueGuide=document.querySelector('#guide');function switchView(view){let galaxy=view==='galaxy';frame.hidden=!galaxy;catalogue.hidden=galaxy;catalogueGuide.hidden=true;document.querySelector('#galaxy-view').setAttribute('aria-pressed',String(galaxy));document.querySelector('#catalog-view').setAttribute('aria-pressed',String(!galaxy));}document.querySelector('#galaxy-view').onclick=()=>switchView('galaxy');document.querySelector('#catalog-view').onclick=()=>switchView('catalogue');document.querySelector('#home').onclick=()=>{home();switchView('galaxy');frame.contentWindow.location.reload()};document.querySelector('#test').onclick=()=>{switchView('catalogue');quiz()};document.querySelector('#guide-test').onclick=()=>{guide.classList.remove('open');quiz()};const guide=document.querySelector('#guide'),gb=document.querySelector('#guide-button');let drag=null,moved=false;gb.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,rect:guide.getBoundingClientRect()};moved=false;gb.setPointerCapture(e.pointerId)};gb.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)<6&&!moved)return;moved=true;guide.style.left=Math.max(0,Math.min(innerWidth-guide.offsetWidth,drag.rect.left+dx))+'px';guide.style.top=Math.max(0,Math.min(innerHeight-guide.offsetHeight,drag.rect.top+dy))+'px';guide.style.right='auto';guide.style.bottom='auto'};gb.onpointerup=()=>{drag=null};gb.onclick=()=>{if(moved)return;let open=guide.classList.toggle('open');gb.setAttribute('aria-expanded',open)};home();
</script></body></html>
